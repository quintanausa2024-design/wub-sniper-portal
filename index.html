// Las fechas llegan como 2026-08-11T18:53:00Z; el portal las espera
// en dd/MM/yyyy HH:mm
function fechaCorta(v){
  if(!v) return '';
  const d = new Date(v);
  if (isNaN(d)) return String(v);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm}/${d.getFullYear()} ${hh}:${mi}`;
}

// Descargar un producto.
// El enlace real ya no viaja al navegador: se pide un permiso de un
// solo uso que dura 60 segundos. Asi no se puede copiar con F12 ni
// pasarselo a alguien que no lo tenga comprado.
async function descargarProducto(pid, boton){
  const antes = boton ? boton.innerHTML : '';
  if (boton) { boton.disabled = true; boton.textContent = 'Preparando...'; }
  try{
    const r = await rwFetch('/descargar/vale',
      { pid, email:(SESS&&SESS.email)||'', pass:(SESS&&SESS.pass)||'' });
    if (r.ok && r.url) {
      window.open(RAILWAY_URL + r.url, '_blank');
    } else {
      const motivos = {
        NO_LO_TIENES:'Este producto todavía no lo tienes liberado.',
        SIN_ARCHIVO:'Este producto aún no tiene archivo de descarga.',
        NO_EXISTE:'No encuentro ese producto.',
        NO_SESION:'Vuelve a entrar e inténtalo otra vez.'
      };
      toast('⚠️ ' + (motivos[r.error] || 'No se pudo preparar la descarga.'));
    }
  }catch(e){ toast('⚠️ Error de conexión. Inténtalo otra vez.'); }
  if (boton) { boton.disabled = false; boton.innerHTML = antes; }
}

//  CENTRO DE AYUDA
//  Busca en las preguntas que TU escribiste. Sin IA: no puede
//  inventarse respuestas ni prometer resultados.
// ═══════════════════════════════════════════════════════════
let AY_TEMAS = null, AY_ABIERTO = false, AY_APUNTADO = 0;
// Guarda si se saludo estando DENTRO o FUERA. Si cambia (entras o
// sales del portal), la conversacion se reinicia con los temas que
// tocan. Antes se saludaba una sola vez y el widget se quedaba con
// las preguntas de la portada aunque ya hubieras entrado.
let AY_SALUDADO_EN = null;

// Pasa las preguntas que ya estaban escritas aqui al centro de ayuda.
// Se ejecuta UNA vez desde la consola del navegador (F12):  importarAyuda()
async function importarAyuda(){
  if (!await rwAsegurarSesion()) { console.error('Entra como admin primero'); return; }
  const r = await rwFetch('/admin/ayuda/importar', { temas: FAQ });
  if (r.ok) { AY_TEMAS = null; console.log('Listo. Preguntas importadas: ' + r.puestos); }
  else if (r.error === 'YA_HAY_TEMAS') console.warn('Ya hay ' + r.total + ' preguntas guardadas.');
  else console.error('No se pudo:', r.error);
}

// ¿Esta el cliente dentro del portal o en la pantalla de entrada?
// En la entrada solo hablamos de cuenta y acceso; dentro, de todo.
function ayudaDentro(){
  return !!(SESS && SESS.email) && view !== 'login';
}
// FUERA del portal (portada y pantalla de entrada) solo se responden
// preguntas de REGISTRO y ACCESO. Quien todavia no ha entrado no
// necesita saber de licencias, AddOns ni prop firms: eso solo le
// confunde, y ademas no puede hacer nada con esa informacion.
// Se filtra por palabras de la propia pregunta, no por categoria:
// "Problemas" incluye cosas de bots que aqui no pintan nada.
const AY_FUERA_PALABRAS = [
  'entro al portal', 'registr', 'contrasena', 'contraseña',
  'correo de bienvenida', 'cambiar el correo', 'desde el celular',
  'tiempo respondes'
];

function ayudaEsDeFuera(t){
  const p = ayNorm(t.pregunta);
  return AY_FUERA_PALABRAS.some(k => p.includes(ayNorm(k)));
}

function ayudaToggle(){
  const p = document.getElementById('ayPanel');
  AY_ABIERTO = !AY_ABIERTO;
  p.classList.toggle('on', AY_ABIERTO);
  if (AY_ABIERTO) {
    ayudaCargar();
    setTimeout(()=>{ const i=document.getElementById('ayInput'); if(i) i.focus(); }, 120);
  }
}

async function ayudaCargar(){
  if (!AY_TEMAS) {
    try{
      const r = await (await fetch(RAILWAY_URL + '/ayuda')).json();
      AY_TEMAS = (r.ok && r.temas) ? r.temas : [];
    }catch(e){ AY_TEMAS = []; }
  }
  const donde = ayudaDentro() ? 'dentro' : 'fuera';
  if (AY_SALUDADO_EN !== donde) { AY_SALUDADO_EN = donde; ayudaSaludo(); }
}

// Solo los temas que tocan segun donde este
function ayudaMisTemas(){
  const t = AY_TEMAS || [];
  if (ayudaDentro()) return t;             // dentro: todas
  return t.filter(ayudaEsDeFuera);         // fuera: solo registro y acceso
}

function ayudaSaludo(){
  const b = document.getElementById('ayBody');
  if (!b) return;
  b.innerHTML = '';
  const dentro = ayudaDentro();
  ayudaDice(dentro
    ? '¡Hola! Pregúntame lo que necesites sobre el portal, tus productos o las licencias.'
    : '¡Hola! Desde aquí te ayudo a <b>registrarte</b> y a <b>entrar al portal</b>.<br><br>Cuando estés dentro podré resolverte dudas sobre productos, licencias e instalación.');
  ayudaSugerencias();
}

// Botones con las preguntas mas habituales
function ayudaSugerencias(){
  const todos = ayudaMisTemas();
  if (!todos.length) return;

  let t;
  if (!ayudaDentro()){
    // fuera: las de registro y acceso, tal cual
    t = todos.slice(0, 4);
  } else {
    // DENTRO: una de cada tema, no las 4 primeras de la lista.
    // Antes salian siempre las de "entrar al portal" y "contraseña",
    // que son justo las que ya vio en la portada.
    const porTema = {};
    for (const x of todos){
      const c = String(x.categoria || 'General');
      if (!porTema[c]) porTema[c] = x;
    }
    // primero los temas que mas le sirven ya estando dentro
    const orden = ['Licencias','Productos','Problemas','Fondeo','Riesgo','Cuenta'];
    t = orden.map(c => porTema[c]).filter(Boolean).slice(0, 4);
    if (t.length < 4) t = Object.values(porTema).slice(0, 4);
  }
  if (!t.length) return;
  const b = document.getElementById('ayBody');
  const d = document.createElement('div');
  d.className = 'ay-sug';
  d.innerHTML = t.map(x =>
    `<button onclick="ayudaResponderA(${x.id})">${escapeHtml(x.pregunta)}</button>`).join('');
  b.appendChild(d);
  b.scrollTop = b.scrollHeight;
}

function ayudaDice(html, mio){
  const b = document.getElementById('ayBody');
  if (!b) return;
  const d = document.createElement('div');
  d.className = 'ay-msg ' + (mio ? 'ay-yo' : 'ay-bot');
  d.innerHTML = html;
  b.appendChild(d);
  b.scrollTop = b.scrollHeight;
  if (!mio) ayudaSonido();
}

// Un tono corto y suave al responder. Se genera solo, sin archivos.
function ayudaSonido(){
  try{
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    const ctx = new A();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(660, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.09);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.06, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.22);
    o.start(ctx.currentTime); o.stop(ctx.currentTime + 0.24);
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 400);
  }catch(e){}
}

  const b = document.getElementById('ayBody');
  const d = document.createElement('div');

// Quita tildes y mayusculas: asi "instalacion" encuentra "instalación"
function ayNorm(t){
  return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

// Palabras que salen en casi todas las respuestas y no dicen nada
// por si solas. Si cuentan, "que es el par cruzado" acaba devolviendo
// la respuesta de "no puedo descargar" solo porque comparten "puedo".
const AY_VACIAS = new Set(['que','como','cual','cuando','donde','para','por','con','los','las',
  'una','uno','del','mas','pero','este','esta','esto','tengo','puedo','hacer','todo','muy',
  'cuenta','producto','productos','portal','sniper']);

function ayudaBuscarTemas(texto){
  const q = ayNorm(texto.trim());
  if (!q) return [];
  const todas = q.split(/\s+/).filter(x => x.length > 2);
  const clave = todas.filter(w => !AY_VACIAS.has(w));   // las que de verdad dicen algo

  return ayudaMisTemas().map(t => {
    const todo = ayNorm(t.pregunta + ' ' + t.respuesta + ' ' + t.categoria);
    const enP  = ayNorm(t.pregunta);
    let p = 0, acertadas = 0;

    if (enP.includes(q)) p += 100;
    else if (todo.includes(q)) p += 40;

    for (const w of clave){
      if (enP.includes(w))      { p += 14; acertadas++; }
      else if (todo.includes(w)){ p += 5;  acertadas++; }
      else {
        // por la RAIZ: "instalar" encuentra "instalo", "instalación"...
        const raiz = w.length > 5 ? w.slice(0, -2) : w;
        if (raiz.length > 3 && todo.includes(raiz)) { p += 4; acertadas++; }
      }
    }

    // Si la pregunta trae varias palabras con significado, tienen que
    // coincidir al menos la mitad. Si no, es casualidad, no respuesta.
    if (clave.length >= 2 && acertadas < Math.ceil(clave.length / 2)) p = 0;
    // Y si ninguna palabra con significado coincide, no vale.
    if (clave.length >= 1 && acertadas === 0) p = 0;

    return { t, p };
  })
  // Se exige un MINIMO de parecido. Sin esto, "que es el par cruzado"
  // devolvia la respuesta de "no puedo descargar" solo porque ambas
  // llevan la palabra "puedo". Contestar cualquier cosa es peor que
  // decir "no te entendi": el cliente piensa que esto no sirve.
  .filter(x => x.p >= 12)
  .sort((a,b) => b.p - a.p).map(x => x.t);
}

async function apiCall(params){
  // Lo de clientes va a Railway; lo demas sigue en Firebase.
  if (RAILWAY_ON && params && EN_RAILWAY.has(params.action)) {
    try { return await llamarRailway(params); }
    catch(e){
      console.error('[RAILWAY] fallo:', params.action, e);
      return { ok:false, error:'CONN' };
    }
  }
  // Antes preguntaba "¿ya esta?" cada 50 ms: se perdian hasta 50 ms por
  // llamada. Ahora Firebase avisa en cuanto esta listo y arrancamos al instante.
  if(typeof window.fbCall!=='function'){
    await new Promise(resolve=>{
      const listo=()=>resolve();
      if(typeof window.fbCall==='function') return resolve();
      window.addEventListener('fb-listo', listo, {once:true});
      setTimeout(resolve, 8000);   // por si acaso, no quedarse colgado
    });
  }
  if(typeof window.fbCall==='function'){ return await window.fbCall(params); }
  // si por lo que sea Firebase no cargó, error claro
  return {ok:false, error:'FIREBASE_NO_CARGO'};
}

  try{

    const email=(res.email||'').toLowerCase().trim();
    const nombre=res.nombre||email;
    if(!email){ throw new Error('sin correo'); }

    // Va a RAILWAY. Antes iba al portero, que escribia en Firebase:
    // por eso las cuentas creadas con Google no aparecian en el panel
    // ni te llegaba aviso de la solicitud.
    const r = await rwFetch('/auth/google', { email, nombre, ref: REF_CODE || '' });

    if(!r.ok){ authMsg='No se pudo entrar con Google. Intenta de nuevo.'; return render(); }
    if(!r.aprobado){
      authMsg='✅ Cuenta creada con Google. Aún no está aprobada — te aviso en cuanto te active.';
      tab='auth_login'; return render();
    }
    if(r.token) rwGuardarToken(r.token);
    CLIENT.name=r.nombre||nombre; CLIENT.email=email;
    SESS={email, pass:'GOOGLE'};
    saveSession(r.rol);
    setView(r.rol==='ADMIN'?'admin':'client');
  }catch(e){
    const cod=String(e&&(e.code||e.message)||'');
    const cerrado = cod.includes('popup-closed') || cod.includes('cancelled') || cod.includes('popup_closed');
    if(cod.includes('unauthorized-domain'))
      authMsg='Este dominio no está autorizado para Google. Abre la página desde sniperportaltrading.com';
    else if(!cerrado)
      authMsg='No se pudo entrar con Google. Intenta de nuevo.';
    render();
    console.warn('[GOOGLE]', e);
  }
}

  try{
    if(remember){ localStorage.setItem('sp_remember',JSON.stringify({email,pass:btoa(pass)})); REMEMBER={email,pass,on:true}; }
    else{ localStorage.removeItem('sp_remember'); REMEMBER={email:'',pass:'',on:false}; }
  }catch(e){}
  if(!API_URL){ setView(email.includes('admin')?'admin':'client'); return; }
  const btn=document.getElementById('lbtn');btn.textContent='Entrando...';

// ── Cajitas del código: escribir, borrar, pegar ──
function otpVal(){
  let v='';
  for(let i=0;i<6;i++){ const el=document.getElementById('otp'+i); v+=(el&&el.value)||''; }
  return v;
}
function otpPinta(){
  const grid=document.getElementById('otpGrid');
  const traces=grid?grid.querySelectorAll('.trace'):[];
  for(let i=0;i<6;i++){
    const el=document.getElementById('otp'+i);
    if(el){
      const lleno=!!el.value;
      el.classList.toggle('lleno', lleno);
      // al llenar una cajita, se dibuja su línea de neón hacia la siguiente
      if(lleno && traces[i]) traces[i].classList.add('on');
    }
  }
}
function otpInput(i){
  const el=document.getElementById('otp'+i);
  el.value=(el.value||'').replace(/[^0-9]/g,'').slice(0,1);
  el.classList.remove('error');
  otpPinta();
  if(el.value && i<5){ const sig=document.getElementById('otp'+(i+1)); if(sig) sig.focus(); }
  if(otpVal().length===6) otpConfirmar();      // se confirma solo al llenar los 6
}
function otpKey(e,i){
  if(e.key==='Backspace' && !e.target.value && i>0){
    e.preventDefault();
    const ant=document.getElementById('otp'+(i-1));
    if(ant){ ant.value=''; ant.focus(); otpPinta(); }
  }
  if(e.key==='ArrowLeft'  && i>0){ const a=document.getElementById('otp'+(i-1)); if(a) a.focus(); }
  if(e.key==='ArrowRight' && i<5){ const b=document.getElementById('otp'+(i+1)); if(b) b.focus(); }
}
function otpPaste(e){
  e.preventDefault();
  const txt=((e.clipboardData||window.clipboardData).getData('text')||'').replace(/[^0-9]/g,'').slice(0,6);
  for(let i=0;i<6;i++){ const el=document.getElementById('otp'+i); if(el) el.value=txt[i]||''; }
  otpPinta();
  const ult=document.getElementById('otp'+Math.min(txt.length,5)); if(ult) ult.focus();
  if(txt.length===6) otpConfirmar();
}

function otpError(){
  const grid=document.getElementById('otpGrid');

  setTimeout(()=>{ for(let i=0;i<6;i++){ const el=document.getElementById('otp'+i); if(el) el.classList.remove('error'); } },600);

// genera una contraseña temporal fácil de leer
function genTempPass(){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';for(let i=0;i<8;i++)s+=c[Math.floor(Math.random()*c.length)];
  return s;
}

function scrollToggle(){
  const abajo=(window.innerHeight+window.scrollY)>=(document.body.scrollHeight-80);
  window.scrollTo({top:abajo?0:document.body.scrollHeight,behavior:'smooth'});
}
function updateScrollBtn(){
  const b=document.getElementById('scrollBtn'); if(!b)return;
  const alto=document.body.scrollHeight-window.innerHeight;
  if(alto<220){ b.classList.remove('show'); return; }   // página corta, no estorba
  b.classList.add('show');
  const abajo=(window.innerHeight+window.scrollY)>=(document.body.scrollHeight-80);
  b.classList.toggle('up',abajo);
  b.title=abajo?'Ir arriba':'Ir abajo';
}

async function sendReview(pid){
  const el=document.getElementById('revtxt');
  const txt=(el?el.value:'').trim();
  REV_TXT=txt; REV_MSG=''; REV_ERR='';

      REV_TXT=''; REV_STARS=0; REVIEWS=null; }

function mktDate(s){
  if(!s)return'';
  try{const d=new Date(s);if(isNaN(d))return'';
    const diff=(Date.now()-d.getTime())/3600000;
    if(diff<1)return'hace minutos';
    if(diff<24)return'hace '+Math.floor(diff)+' h';
    const dias=Math.floor(diff/24); if(dias===1)return'ayer';
    if(dias<7)return'hace '+dias+' días';
    return d.toLocaleDateString('es',{day:'numeric',month:'short'});
  }catch(e){return''}
}

}

    BAL_ACCESO = acc.ok ? acc : { puede:false, abierto:false };
    if (BAL_ACCESO.puede){

// Ventana de confirmacion propia. La del navegador sale con el
// nombre del dominio y rompe el aspecto del portal.
function confirmar(texto, titulo, textoSi, peligro){
  return new Promise(resolve=>{
    document.getElementById('confTitulo').textContent = titulo || (LANG==='en'?'Are you sure?':'¿Seguro?');
    document.getElementById('confTexto').innerHTML = texto;
    const si = document.getElementById('confSi');
    si.textContent = textoSi || (LANG==='en'?'Yes':'Sí');
    si.style.background = peligro ? 'var(--red)' : '';
    document.getElementById('confNo').textContent = LANG==='en'?'Cancel':'Cancelar';
    document.getElementById('confModal').classList.add('show');
    _confirmarOK = resolve;
  });
}
function cerrarConfirmar(si){
  document.getElementById('confModal').classList.remove('show');
  if (_confirmarOK){ const f=_confirmarOK; _confirmarOK=null; f(!!si); }
}

function toggleSeleccion(){ BAL_SELMODO = !BAL_SELMODO; BAL_SEL.clear(); renderKeep(); }

// Marcar o desmarcar todas las cuentas vivas de golpe
function marcarTodas(si){
  BAL_SEL.clear();
  if (si) for (const c of (BALANCE?.cuentas||[])) if (!c.eliminada) BAL_SEL.add(Number(c.id));
  renderKeep();
}

    : '¿Borrar este retiro?<br><br>El dinero vuelve al PnL de la cuenta.',
    isEn?'Delete payout':'Borrar retiro', isEn?'Delete':'Borrar', true)) return;

}

// Borrar del todo una cuenta archivada. Distinto de archivar:
// aqui SI sale de los totales, porque fue un error.
async function borrarDelTodo(id){
  const isEn = LANG==='en';
  const c = (BALANCE?.cuentas||[]).find(x=>Number(x.id)===Number(id));
  const tuvoRetiros = c && c.retirado > 0;

  if (!await confirmar(isEn
    ? `Delete this account <b>for good</b>?<br><br>Unlike archiving, this takes it out of your totals${
        tuvoRetiros?` — including the <b>${dinero(c.retirado)}</b> withdrawn from it`:''}.<br><br>Use it only if you added it by mistake.`
    : `¿Borrar esta cuenta <b>del todo</b>?<br><br>A diferencia de archivar, sale de tus totales${
        tuvoRetiros?` — incluidos los <b>${dinero(c.retirado)}</b> que retiraste de ella`:''}.<br><br>Úsalo solo si la metiste por error.`,
    isEn?'Delete for good':'Borrar del todo', isEn?'Delete':'Borrar', true)) return;

  const r = await rwFetch('/cuentas/eliminar-definitivo',
    { email:SESS.email, pass:SESS.pass, id, confirmar:'SI' });
  if (r.ok && r.borradas){ await recargarCuentas(); toast(isEn?'Deleted':'Borrada'); }
  else toast(isEn?"Couldn't delete.":'No se pudo borrar.');
}

}

function sugerirPrecio(){
  const firma = document.getElementById('ctaFirma')?.value;
  const tam = document.getElementById('ctaTamano')?.value;
  const c = document.getElementById('ctaCosto');
  if (!c || c.dataset.tocado==='1') return;
  const p = (BAL_PRECIOS[firma]||{})[tam];
  if (p){ c.value = p; calcularTotal(); }
}

function calcularTotal(){
  const precio = parseFloat(document.getElementById('ctaCosto')?.value) || 0;
  const cant = parseInt(document.getElementById('ctaCant')?.value, 10) || 1;
  const caja = document.getElementById('ctaTotal');
  if (!caja) return;
  caja.innerHTML = (cant>1 && precio>0)
    ? `${cant} × ${dinero(precio)} = <b style="color:var(--fire-soft)">${dinero(Math.round(precio*cant*100)/100)}</b>`
    : '';
}

async function guardarCompra(){
  const isEn = LANG==='en';
  const err = document.getElementById('movErr');
  const costo = parseFloat(document.getElementById('ctaCosto').value);
  if (!(costo > 0)){
    err.innerHTML = `<div class="login-err show">${isEn?'Enter a price greater than 0.':'Escribe un precio mayor que 0.'}</div>`;
    return;
  }
  err.innerHTML = '';
  const btn = document.getElementById('movGuardar');
  if (btn){ btn.disabled = true; btn.textContent = isEn?'Saving...':'Guardando...'; }

  const r = await rwFetch('/cuentas/comprar', {
    email:SESS.email, pass:SESS.pass, costo,
    cantidad: parseInt(document.getElementById('ctaCant').value,10) || 1,
    firma: document.getElementById('ctaFirma').value,
    tamano: document.getElementById('ctaTamano').value,
    numero: document.getElementById('ctaNumero')?.value || '',
    fecha: document.getElementById('ctaFecha').value,
    notas: document.getElementById('ctaNotas').value
  });

  if (btn){ btn.disabled = false; btn.textContent = isEn?'Save':'Guardar'; }
  if (r.ok){
    closeModal('movModal');
    await recargarCuentas();
    toast(r.creadas>1
      ? (isEn?`${r.creadas} accounts added`:`${r.creadas} cuentas añadidas`)
      : (isEn?'Account added':'Cuenta añadida'));
  } else {
    err.innerHTML = `<div class="login-err show">${isEn?"Couldn't save.":'No se pudo guardar.'}</div>`;

  const nombre = c ? [c.firma,c.tamano].filter(Boolean).join(' ') : '';

  document.getElementById('movBody').innerHTML = `
    <div style="font-size:12.5px;color:var(--text-faint);margin-bottom:14px;line-height:1.55">
      ${escapeHtml(nombre)}<br>
      ${isEn?'How much PnL does this account have?':'¿Qué PnL tiene esta cuenta?'}
    </div>
    <div class="mfield"><label>PnL (USD)</label>
      <input type="number" id="pnlVal" step="0.01" placeholder="0.00" inputmode="decimal"
             value="${c&&c.pnl?c.pnl:''}"></div>
    <div style="font-size:11.5px;color:var(--text-faint);margin-top:-6px">

// ═══════════════════════════════════════════════════════════
//  VALORACION DE LAS PROP FIRMS
//  El cliente pone estrellas y se publica al momento, sin que
//  tengas que aprobar nada. Un voto por cliente y firma: si
//  vuelve a votar, cambia el suyo en vez de sumar otro.
// ═══════════════════════════════════════════════════════════
let VALORACIONES = null;   // { medias:{id:{media,votos}}, mios:{id:estrellas} }

async function cargarValoraciones(forzar){
  if (VALORACIONES && !forzar) return VALORACIONES;
  try{
    const r = await (await fetch(RAILWAY_URL + '/valoraciones', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ email:(SESS&&SESS.email)||'' })
    })).json();
    VALORACIONES = r.ok ? { medias:r.medias||{}, mios:r.mios||{} } : { medias:{}, mios:{} };
  }catch(e){ VALORACIONES = { medias:{}, mios:{} }; }
  return VALORACIONES;
}

function estrellaSVG(llena){
  return `<svg viewBox="0 0 24 24" fill="${llena?'currentColor':'none'}"
    stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <polygon points="12 2 15.09 8.6 22 9.5 17 14.3 18.2 21.2 12 17.9 5.8 21.2 7 14.3 2 9.5 8.91 8.6 12 2"/></svg>`;
}

function valoracionHTML(id, isEn){
  if (!id) return '';
  const v = VALORACIONES || { medias:{}, mios:{} };
  const dato = v.medias[id] || { media:0, votos:0 };
  const mio  = v.mios[id] || 0;
  // solo puede votar un cliente que ha entrado
  const puedo = !!(SESS && SESS.email) && view !== 'login';
  const pintadas = mio || Math.round(dato.media);

  let estrellas = '';
  for (let i = 1; i <= 5; i++){
    estrellas += `<button class="val-st ${i <= pintadas ? 'on':''}"
      ${puedo ? `onclick="event.stopPropagation();votarFirma('${id}',${i},this)"` : ''}
      title="${puedo ? (isEn?'Rate '+i:'Valorar con '+i) : (isEn?'Log in to rate':'Entra para valorar')}"
      >${estrellaSVG(i <= pintadas)}</button>`;
  }

  const texto = dato.votos
    ? `${dato.media} · ${dato.votos} ${dato.votos===1 ? (isEn?'vote':'voto') : (isEn?'votes':'votos')}`
    : (isEn ? 'No ratings yet' : 'Sin valoraciones');

  return `<div class="val-row ${puedo?'val-puedo':''}" id="val-${id}">
    <div class="val-stars">${estrellas}</div>
    <span class="val-txt">${texto}</span>
    ${mio ? `<span class="val-mio">${isEn?'Your rating':'Tu voto'}</span>` : ''}
  </div>`;
}

async function votarFirma(id, estrellas, btn){
  if (!(SESS && SESS.email)) return;
  const fila = document.getElementById('val-' + id);
  if (fila) fila.style.opacity = '.5';
  try{
    const r = await rwFetch('/valoraciones/votar', {
      email: SESS.email, pass: SESS.pass, firma_id: id, estrellas
    });
    if (r.ok){
      VALORACIONES.medias[id] = { media:r.media, votos:r.votos };
      VALORACIONES.mios[id] = r.mio;
      if (fila) fila.outerHTML = valoracionHTML(id, LANG==='en');
      toast(LANG==='en' ? 'Thanks for rating!' : '¡Gracias por valorar!');
    } else {
      if (fila) fila.style.opacity = '1';
      toast(LANG==='en' ? "Couldn't save your rating." : 'No se pudo guardar tu voto.');
    }
  }catch(e){
    if (fila) fila.style.opacity = '1';
    toast(LANG==='en' ? 'Connection error.' : 'Error de conexión.');
  }
}

async function sendContact(){
  const m=(document.getElementById('cmsg').value||'').trim();
  const tel=(document.getElementById('ctel')?document.getElementById('ctel').value:'').trim();
  if(!m){contactDone='ERR';return render();}
  CONTACT_TEL=tel;
  try{ if(tel) localStorage.setItem('sp_tel',tel); }catch(e){}
  if(!API_URL){contactDone='OK';return render();}
  const btn=document.getElementById('cbtn');btn.textContent=t('enviando_msg');
  // Va por el PORTERO, no directo a Firestore. El portero comprueba que seas
  // cliente aprobado y aplica frenos que no se pueden saltar desde el navegador.
  try{
    const qs=new URLSearchParams({accion:'contacto',email:CLIENT.email,
      nombre:CLIENT.name||'',mensaje:m,telefono:tel}).toString();
    const res=await fetch(MAIL_URL+'?'+qs);
    const r=await res.json();
    contactDone=r.ok?'OK':'ERR';render();
  }catch(e){contactDone='ERR';render();}
}

// ── MODO MANTENIMIENTO ──
let MAINT={on:false,msg:''}, MAINT_LOADED=false, MAINT_SAVING=false, MAINT_LOADING=false;
function maintTexto(){
  return MAINT.msg && MAINT.msg.trim()
    ? MAINT.msg.trim()
    : (LANG==='en'
        ? 'MAINTENANCE IN PROGRESS — I am updating the portal. Sorry for any error you may see.'
        : 'MANTENIMIENTO EN CURSO — Estoy actualizando el portal. Disculpa cualquier error que veas.');
}
function pintarMaint(){
  const bar=document.getElementById('maintBar'); if(!bar)return;
  if(!MAINT.on){ bar.classList.remove('show'); document.body.classList.remove('has-maint'); bar.innerHTML=''; return; }
  const txt=maintTexto();
  const tira=`<span class="maint-item">${sv(I.tool,15)} ${txt}</span>`;
  // 4 copias en 2 mitades iguales → el -50% del keyframe hace un loop perfecto y lento
  bar.innerHTML=`<div class="maint-track">${tira.repeat(4)}</div>`;
  bar.classList.add('show'); document.body.classList.add('has-maint');
}
async function loadMaint(){
  if(!API_URL)return;
  if(MAINT_LOADING)return;   // evitar llamadas repetidas (bucle)
  MAINT_LOADING=true;
  const antes=MAINT.on;
  try{ const r=await apiCall({action:'getmaint'});
    if(r.ok){ MAINT={on:!!r.maint,msg:r.msg||''}; } }catch(e){}
  MAINT_LOADED=true; MAINT_LOADING=false; pintarMaint();
  // si estoy en mi perfil de admin y cambió el estado, refrescar el switch
  if(view==='admin' && tab==='aprofile' && antes!==MAINT.on) renderKeep();
}
async function toggleMaint(){
  if(MAINT_SAVING)return; MAINT_SAVING=true;
  const nuevo=!MAINT.on;
  const el=document.getElementById('maintMsg');
  if(el)MAINT.msg=(el.value||'').trim();
  MAINT.on=nuevo; MAINT_LOADED=true; renderKeep(); pintarMaint();
  try{ await apiCall({action:'setmaint',email:SESS.email,pass:SESS.pass,on:nuevo?'SI':'NO',msg:MAINT.msg}); }catch(e){}
  MAINT_SAVING=false;
}
async function saveMaintMsg(){
  const el=document.getElementById('maintMsg'); if(!el)return;
  MAINT.msg=(el.value||'').trim();
  const b=document.getElementById('maintSave'); if(b)b.textContent='Guardado ✓';
  try{ await apiCall({action:'setmaint',email:SESS.email,pass:SESS.pass,on:MAINT.on?'SI':'NO',msg:MAINT.msg}); }catch(e){}
  pintarMaint();
  setTimeout(()=>{const x=document.getElementById('maintSave');if(x)x.textContent='Guardar aviso';},1400);
}

  const tj=SRV_STATS?SRV_STATS.pay_tarjeta!==false:true;

      <div class="card-name">${sv(I.card,16)} Métodos de pago</div>

          <div class="pay-tg-hint ${ze?'on':''}">${ze?'✓ Disponible para los clientes':'○ Apagado · el cliente ve "no disponible"'}</div>
        </div>
        <button class="switch ${ze?'on':''}" onclick="togglePago('zelle',${ze?0:1})"><span></span></button>
      </div>
      <div class="pay-toggle" style="margin-top:14px">
        <div style="flex:1;min-width:0">
          <div class="pay-tg-name">PayPal</div>
          <div class="pay-tg-hint ${pp?'on':''}">${pp?'✓ Disponible para los clientes':'○ Apagado · el cliente ve "no disponible"'}</div>
        </div>
        <button class="switch ${pp?'on':''}" onclick="togglePago('paypal',${pp?0:1})"><span></span></button>
      </div>
      <div class="pay-toggle" style="margin-top:14px">
        <div style="flex:1;min-width:0">
          <div class="pay-tg-name">Tarjeta de débito o crédito</div>
          <div class="pay-tg-hint ${tj?'on':''}">${tj?'✓ El cliente te escribe por WhatsApp y le mandas el link':'○ Apagado · el cliente ve "no disponible"'}</div>

        <button class="switch ${tj?'on':''}" onclick="togglePago('tarjeta',${tj?0:1})"><span></span></button>

      ${(!ze&&!pp&&!tj)?`<div class="pay-warn">⚠️ Los tres están apagados. El cliente no podrá pagar por ningún método.</div>`:''}
    </div></div>` + balanceCard() + anuncioCard();
}

// Escribes un mensaje y sale a todos los clientes, o solo a los
// de un producto. Antes de enviar SIEMPRE se puede mirar a
// cuantos va: 80 correos no tienen marcha atras.
let ANUN_TOTAL = null, ANUN_ENVIANDO = false;

function anuncioCard(){
  const prods = (ADMIN_PRODS||[]).map(p=>p.nombre).filter(Boolean);
  const licProds = ['AUTO PRO ROCKET','SNIPER MANAGER','SNIPER CONNECT','SNIPER OPEN NY',
    'SNIPER COPY ONLINE','REPLICADOR NT8 Y TOSTEP','ESTRATEGIA NT8 VS TS Y NT8 VS NT8',
    'SNIPEROCKET HISTORIAL'];

  return `<div class="card"><div class="card-top">
      <div class="card-name">${sv(I.mail,15)} Anuncios por correo</div>
      <div class="card-cat">ESCRIBE UNA VEZ · LLEGA A TODOS</div></div>
    <div style="padding:18px 20px">

      <div class="mfield"><label>¿A quién?</label>
        <select id="anGrupo" onchange="anuncioCambioGrupo()">
          <option value="TODOS">Todos los clientes aprobados</option>
          <option value="PRODUCTO">Solo los de un producto</option>
        </select></div>

      <div id="anProdBox" style="display:none">
        <div class="mfield"><label>¿Qué producto?</label>
          <select id="anProducto" onchange="ANUN_TOTAL=null;renderKeep()">
            ${licProds.map(p=>`<option>${p}</option>`).join('')}
          </select></div>
        <div class="mfield"><label>¿Quiénes de ese producto?</label>
          <select id="anFiltro" onchange="ANUN_TOTAL=null;renderKeep()">
            <option value="">Todos los que lo tienen</option>
            <option value="SIN">Solo los que NO han actualizado</option>
            <option value="YA">Solo los que YA actualizaron</option>
          </select></div>
      </div>

      <div class="mfield"><label>Asunto</label>
        <input type="text" id="anAsunto" maxlength="120" placeholder="Ej: Actualización disponible"></div>

      <div class="mfield"><label>Mensaje</label>
        <textarea id="anTexto" rows="7" placeholder="Hola [NOMBRE],&#10;&#10;Escribe aquí tu mensaje..."
          style="width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:11px;
                 padding:12px;color:var(--text);font-family:var(--body);font-size:13.5px;
                 line-height:1.6;resize:vertical"></textarea></div>
      <div style="font-size:11.5px;color:var(--text-faint);margin:-8px 0 14px;line-height:1.6">
        Escribe <b>[NOMBRE]</b> donde quieras que aparezca el nombre de cada cliente.
      </div>

      <label style="display:flex;align-items:center;gap:9px;margin-bottom:16px;cursor:pointer">
        <input type="checkbox" class="bal-chk" id="anBoton" checked>
        <span style="font-size:12.5px;color:var(--text-dim)">Incluir botón "Entrar al portal"</span>
      </label>

      ${ANUN_TOTAL===null ? '' : `<div style="background:var(--bg-2);border-radius:10px;
        padding:13px 15px;margin-bottom:14px;font-size:13px;color:var(--text-dim)">
        Va a <b style="color:var(--fire-soft)">${ANUN_TOTAL}</b> ${ANUN_TOTAL===1?'persona':'personas'}.
        ${ANUN_TOTAL>280?'<br><span style="color:var(--red)">Son más de 280 y el límite diario de Brevo es 300. Divídelo en dos días.</span>':''}
      </div>`}

      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn-ghost" onclick="anuncioMirar()">${sv(I.users,15)} Ver a cuántos va</button>
        <button class="btn-add" onclick="anuncioEnviar()"
          ${(ANUN_TOTAL===null||ANUN_ENVIANDO||ANUN_TOTAL>280)?'disabled':''}>
          ${ANUN_ENVIANDO?'Enviando...':`${sv(I.send,15)} Enviar`}</button>
      </div>

      <div id="anMsg" style="margin-top:14px"></div>

      <div style="margin-top:16px;font-size:11.5px;color:var(--text-faint);line-height:1.6">
        Los correos salen uno a uno, cada cliente recibe el suyo.
        Nadie ve los correos de los demás.
      </div>
    </div></div>`;
}

function anuncioCambioGrupo(){
  const esProd = document.getElementById('anGrupo').value==='PRODUCTO';
  document.getElementById('anProdBox').style.display = esProd ? '' : 'none';
  ANUN_TOTAL = null;
  document.getElementById('anMsg').innerHTML = '';
}

function anuncioDatos(){
  const grupo = document.getElementById('anGrupo').value;
  const filtro = document.getElementById('anFiltro')?.value || '';
  return {
    grupo,
    producto: grupo==='PRODUCTO' ? document.getElementById('anProducto').value : '',
    solo_sin_migrar: filtro==='SIN' ? 'SI' : 'NO',
    solo_migrados:   filtro==='YA'  ? 'SI' : 'NO'
  };
}

async function anuncioMirar(){
  const msg = document.getElementById('anMsg');
  msg.innerHTML = '<span style="font-size:12.5px;color:var(--text-faint)">Mirando...</span>';
  const r = await rwFetch('/admin/anuncio/destinatarios', anuncioDatos());
  if (r.ok){
    ANUN_TOTAL = r.total;
    msg.innerHTML = r.total
      ? `<div style="font-size:12.5px;color:var(--text-faint)">Primeros: ${r.primeros.slice(0,5).join(', ')}${r.total>5?'...':''}</div>`
      : '<div class="login-err show">No hay nadie en ese grupo.</div>';
    renderKeep();
  } else msg.innerHTML = '<div class="login-err show">No se pudo consultar.</div>';
}

async function anuncioEnviar(){
  const asunto = document.getElementById('anAsunto').value.trim();
  const texto = document.getElementById('anTexto').value.trim();
  const msg = document.getElementById('anMsg');

  if (!asunto){ msg.innerHTML = '<div class="login-err show">Falta el asunto.</div>'; return; }
  if (texto.length < 10){ msg.innerHTML = '<div class="login-err show">El mensaje es muy corto.</div>'; return; }

  if (!await confirmar(
    `Vas a enviar este correo a <b>${ANUN_TOTAL}</b> ${ANUN_TOTAL===1?'persona':'personas'}.<br><br>` +
    `<b>${escapeHtml(asunto)}</b><br><br>No se puede deshacer.`,
    'Enviar anuncio', 'Enviar', false)) return;

  ANUN_ENVIANDO = true; renderKeep();
  const r = await rwFetch('/admin/anuncio/enviar', {
    ...anuncioDatos(), asunto, texto,
    boton: document.getElementById('anBoton')?.checked ? 'SI' : 'NO',
    titulo: 'SNIPER PORTAL', confirmar: 'SI'
  });
  ANUN_ENVIANDO = false;

  const m = document.getElementById('anMsg');
  if (r.ok){
    ANUN_TOTAL = null;
    document.getElementById('anAsunto').value = '';
    document.getElementById('anTexto').value = '';
    renderKeep();
    toast(`Enviados ${r.enviados} de ${r.total}`);
    setTimeout(()=>{ const mm=document.getElementById('anMsg');
      if(mm) mm.innerHTML = `<div style="background:rgba(29,158,117,.12);border:1px solid rgba(29,158,117,.3);
        border-radius:10px;padding:12px 14px;font-size:13px;color:var(--green)">
        ✓ Enviados: <b>${r.enviados}</b>${r.fallos?` · fallaron ${r.fallos}`:''}
        ${r.problemas&&r.problemas.length?`<div style="color:var(--text-faint);font-size:11.5px;margin-top:6px">
          Correos mal escritos: ${r.problemas.join(', ')}</div>`:''}</div>`; }, 100);
  } else {
    const motivos = { SIN_BREVO:'Falta la clave de Brevo.', SIN_DESTINATARIOS:'No hay nadie en ese grupo.',
      DEMASIADOS:r.aviso||'Son demasiados para un día.', TEXTO_CORTO:'El mensaje es muy corto.' };
    m.innerHTML = `<div class="login-err show">${motivos[r.error]||'No se pudo enviar.'}</div>`;
    renderKeep();
  }
}

    else if(metodo==='paypal') SRV_STATS.pay_paypal=!!activar;
    else                       SRV_STATS.pay_tarjeta=!!activar;
  }
  renderKeep();
  const params={action:'setstats',email:SESS.email,pass:SESS.pass};
  const campo = metodo==='zelle' ? 'pay_zelle' : (metodo==='paypal' ? 'pay_paypal' : 'pay_tarjeta');

  try{ await apiCall(params); }catch(e){}

async function loadAdmins(){
  ADMINS_LOADING=true;
  try{
    const qs=new URLSearchParams({accion:'lista_admins',padmin:SESS.email,ppass:SESS.pass}).toString();
    const r=await (await fetch(MAIL_URL+'?'+qs)).json();
    ADMINS_LIST = (r&&r.ok&&r.admins)?r.admins:[];
  }catch(e){ ADMINS_LIST=[]; }
  ADMINS_LOADING=false; renderKeep();
}

async function activarAdmin(){
  const email=(document.getElementById('newAdminEmail').value||'').trim().toLowerCase();
  if(!email||email.indexOf('@')<0){ toast('Escribe un correo válido'); return; }
  const btn=document.getElementById('addAdminBtn'); if(btn) btn.textContent='Activando...';
  try{
    const tipo=(document.getElementById('newAdminTipo')||{}).value||'limitado';
    const qs=new URLSearchParams({accion:'hacer_admin',padmin:SESS.email,ppass:SESS.pass,email,tipo}).toString();
    const r=await (await fetch(MAIL_URL+'?'+qs)).json();
    if(r&&r.ok){ toast('✅ '+(r.nombre||email)+' ahora es admin'); ADMINS_LIST=null; renderKeep(); }
    else{
      const m={NO_EXISTE:'Ese correo no tiene cuenta. Que se registre primero.',
               NO_ADMIN:'No tienes permiso.',SIN_EMAIL:'Escribe un correo.'};
      toast(m[r&&r.error]||'No se pudo activar'); if(btn) btn.textContent='Activar admin';
    }
  }catch(e){ toast('Error de conexión'); if(btn) btn.textContent='Activar admin'; }
}

function quitarAdmin(email){
  confirmAction('Quitar admin',
    `¿Quitar el acceso de administrador a <b>${email}</b>? Volverá a ser cliente normal.`,'Quitar',async()=>{
    try{
      const qs=new URLSearchParams({accion:'quitar_admin',padmin:SESS.email,ppass:SESS.pass,email}).toString();
      const r=await (await fetch(MAIL_URL+'?'+qs)).json();
      if(r&&r.ok){ toast('Admin quitado'); ADMINS_LIST=null; renderKeep(); }
      else{
        const m={NO_TE_QUITES:'No puedes quitarte admin a ti mismo.'};
        toast(m[r&&r.error]||'No se pudo quitar');
      }
    }catch(e){ toast('Error de conexión'); }
  });
}

async function changePass(){
  const p0=document.getElementById('np0').value||'';
  const p1=document.getElementById('np1').value||'', p2=document.getElementById('np2').value||'';
  profileMsg='';profileErr='';
  if(!p0){profileErr='Escribe tu contraseña actual.';return render();}
  if(!p1||p1.length<4){profileErr='La contraseña nueva debe tener al menos 4 caracteres.';return render();}
  if(p1!==p2){profileErr='Las contraseñas nuevas no coinciden.';return render();}
  if(p0===p1){profileErr='La nueva no puede ser igual a la actual.';return render();}
  const btn=document.getElementById('cpbtn');btn.textContent='Guardando...';
  try{
    const r=await apiCall({action:'changepass',email:CLIENT.email,oldpass:p0,newpass:p1});
    if(r.ok){profileMsg='✅ ¡Listo! Tu contraseña quedó cambiada.';render();}
    else if(r.error==='WRONGPASS'){profileErr='La contraseña actual no es correcta.';render();}
    else{profileErr='No se pudo cambiar. Intenta de nuevo.';render();}
  }catch(e){profileErr='Error de conexión. Intenta de nuevo.';render();}
}

function toEmbed(url){
  if(!url) return '';
  let m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/);
  if(m) return 'https://www.youtube.com/embed/'+m[1];
  m=url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if(m) return 'https://drive.google.com/file/d/'+m[1]+'/preview';
  return url;
}

let PAY_CTX={};
// arma el mensaje de comprobante con nombre, correo y producto del cliente
function comprobanteTexto(metodo){
  const isEn=LANG==='en';
  const nom=(CLIENT&&CLIENT.name)||'';
  const mail=(CLIENT&&CLIENT.email)||'';
  return isEn
    ? `Hi, I just paid by ${metodo}. Here's my proof.\nName: ${nom}\nEmail: ${mail}\nProduct: ${PAY_CTX.nombre||''}${PAY_CTX.precio?(' ($'+PAY_CTX.precio+')'):''}`
    : `Hola, acabo de pagar por ${metodo}. Aquí está mi comprobante.\nNombre: ${nom}\nCorreo: ${mail}\nProducto: ${PAY_CTX.nombre||''}${PAY_CTX.precio?(' ($'+PAY_CTX.precio+')'):''}`;
}
// mensaje de "quiero pagar con tarjeta" — ya lleva producto, precio y datos del cliente
function pedirTarjetaTexto(){
  const isEn=LANG==='en';
  const nom=(CLIENT&&CLIENT.name)||'';
  const mail=(CLIENT&&CLIENT.email)||'';
  const prod=PAY_CTX.nombre||'';
  const pre=PAY_CTX.precio?(' ($'+PAY_CTX.precio+')'):'';
  return isEn
    ? `Hi, I want to buy ${prod}${pre} and pay by debit/credit card.\nName: ${nom}\nEmail: ${mail}\nCould you send me the payment link?`
    : `Hola, quiero comprar ${prod}${pre} y pagar con tarjeta de débito o crédito.\nNombre: ${nom}\nCorreo: ${mail}\n¿Me mandas el link de pago?`;
}
// botones de comprobante: WhatsApp, Telegram y correo
function comprobanteBtns(metodo){
  const isEn=LANG==='en';
  const txt=comprobanteTexto(metodo);
  // WhatsApp quitado a proposito: quedan correo y Telegram.
  const tg='https://t.me/'+TELEGRAM_USER;   // Telegram NO permite pre-llenar texto en chat directo
  const asunto=encodeURIComponent((isEn?'Payment proof · ':'Comprobante de pago · ')+(PAY_CTX.nombre||''));
  const mail='mailto:'+CONTACT_MAIL+'?subject='+asunto+'&body='+encodeURIComponent(txt);
  const lbl=isEn?'Send proof by:':'Enviar comprobante por:';
  // guardamos el texto para copiarlo si usa Telegram
  window.__proofTxt=txt;
  return `<div class="proof-wrap">
    <div class="proof-lbl">${sv(I.check,13)} ${lbl}</div>
    <div class="proof-btns">
      <a class="proof-btn mail" href="${mail}">${sv(I.mail,15)} ${isEn?'Email':'Correo'}</a>
      ${TELEGRAM_USER?`<a class="proof-btn tg" href="${tg}" target="_blank" rel="noopener" onclick="copiarProof()">${sv(I.send,15)} Telegram</a>`:''}
    </div>
    ${TELEGRAM_USER?`<div class="proof-tg-note" id="proofTgNote">${sv(I.copy,12)} ${isEn?'For Telegram: your details are copied — just paste them in the chat and attach the screenshot.':'Para Telegram: tus datos se copian solos — solo pégalos en el chat y adjunta la captura.'}</div>`:''}
    <div class="proof-note">${isEn?'Attach the payment screenshot in the chat.':'Adjunta la captura del pago en el chat.'}</div>
  </div>`;
}
// copia el texto del comprobante al abrir Telegram (para que solo lo pegue)
function copiarProof(){
  const t=window.__proofTxt||'';
  try{ navigator.clipboard.writeText(t); }catch(e){
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');}catch(x){} document.body.removeChild(ta);
  }
  const n=document.getElementById('proofTgNote');
  if(n){ n.classList.add('copied'); n.innerHTML=(LANG==='en'?'✓ Copied! Paste it in the Telegram chat and attach the screenshot.':'✓ ¡Copiado! Pégalo en el chat de Telegram y adjunta la captura.'); }
}

// ── aviso chico abajo (toast) ──
let TOAST_T=null;
function toast(msg){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
  el.textContent=msg; el.classList.add('show');
  clearTimeout(TOAST_T); TOAST_T=setTimeout(()=>el.classList.remove('show'),2600);
}
// ── QR grande a pantalla completa para escanear desde otro celular ──
function zoomQR(src,metodo){
  const isEn=LANG==='en';
  let ov=document.getElementById('qrZoom');
  if(!ov){ ov=document.createElement('div'); ov.id='qrZoom'; ov.className='qr-zoom';
    ov.onclick=()=>ov.classList.remove('show'); document.body.appendChild(ov); }
  ov.innerHTML=`<div class="qr-zoom-box" onclick="event.stopPropagation()">
    <img src="${src}" alt="QR ${metodo}">
    <div class="qr-zoom-cap">${metodo} · ${isEn?'Scan from the other phone':'Escanea desde el otro celular'}</div>
    <button class="qr-zoom-x" onclick="document.getElementById('qrZoom').classList.remove('show')">✕ ${isEn?'Close':'Cerrar'}</button></div>`;
  ov.classList.add('show');
}

function adminView(){

  const nav = limitado
    ? // su panel de usuario COMPLETO + las dos pestañas de aprobar
      navBtn('products',I.box,t('nav_productos'))+navBtn('guides',I.play,t('nav_guias'))
      +navBtn('balance',I.chart,LANG==='en'?'My balance':'Mi balance')

      +navBtn('aprofile',I.user,t('nav_perfil'))

      +`<div class="nav-sep">MÍO</div>`
      +navBtn('balance',I.chart,'Mi balance')+navBtn('aprofile',I.user,'Mi Perfil');
  // el admin limitado NO puede entrar a estas de admin
  if(limitado && ['aprod','arev','aref','adisc','aguides','anews','amsg'].indexOf(tab)>=0){ tab='clients'; }
  let content;
  // Mi balance: lo ven los dos (el CEO para probarlo, el socio como cliente)
  if(tab==='balance')                   content=balancePage();
  // pestañas de USUARIO (para el limitado)
  else if(limitado && tab==='products')  content=productsPage();
  else if(limitado && tab==='guides')   content=guidesPage();
  else if(limitado && tab==='discounts')content=discountsPage();
  else if(limitado && tab==='news')     content=newsPage();
  else if(limitado && tab==='help')     content=faqPage();
  else if(limitado && tab==='contact')  content=contactPage();
  // pestañas de ADMIN
  else if(tab==='clients')content=clientsPage();
  else if(tab==='aprod')content=adminProductsPage();
  else if(tab==='alic')content=adminLicensesPage();
  else if(tab==='arev')content=adminReviewsPage();
  else if(tab==='aref')content=adminReferidosPage();
  else if(tab==='adisc')content=adminDiscountsPage();
  else if(tab==='aguides')content=adminGuidesPage();
  else if(tab==='anews')content=adminNewsPage();
  else if(tab==='amsg')content=adminMessagesPage();
  else content=profilePage();
  return shell(nav, content)}

// ── vuelve a dibujar sin perder el lugar donde estabas ──
let _lastView=null;
// repinta SOLO la zona central (no el menu lateral) -> sin parpadeo
function renderKeep(){
  const y=window.scrollY;
  const slot=document.getElementById('mainSlot');
  if(slot && _lastView===view && (view==='admin'||view==='client')){
    try{
      const html = view==='admin' ? adminView() : clientView();
      const tmp=document.createElement('div'); tmp.innerHTML=html;
      const nuevo=tmp.querySelector('#mainSlot');
      if(nuevo){
        // si no cambio nada, ni tocamos el DOM (evita destellos innecesarios)
        if(slot.innerHTML!==nuevo.innerHTML) slot.innerHTML=nuevo.innerHTML;
        window.scrollTo(0,y);
        setTimeout(updateScrollBtn,0);
        return;
      }
    }catch(e){}
  }
  render(); window.scrollTo(0,y);
}

  const u=(ADMIN_USERS||[]).find(x=>x.email===em);
  if(u){ u.aprobado='SI'; renderKeep(); }          // se ve el cambio al instante
  try{ await apiCall({action:'approve',email:SESS.email,pass:SESS.pass,target:em}); }catch(e){}
  // El correo de bienvenida lo manda el SERVIDOR al aprobar.
  // Aqui habia otro envio: por eso llegaban DOS correos.
}
async function revokeUser(em){
  const u=(ADMIN_USERS||[]).find(x=>x.email===em);
  if(u){ u.aprobado='NO'; renderKeep(); }
  try{ await apiCall({action:'revoke',email:SESS.email,pass:SESS.pass,target:em}); }catch(e){}
}

// lee lo REAL de Firebase por detras, SIN borrar la lista (evita el parpadeo)
let REFRESCANDO=false;
async function refrescarDesdeFirebase(){
  if(REFRESCANDO) return; REFRESCANDO=true;
  // marcar el boton como "cargando" sin tocar el resto de la pagina
  const btns=[...document.querySelectorAll('.admin-toolbar .btn-ghost')]
    .filter(b=>/Actualizar/i.test(b.textContent));
  const orig=btns.map(b=>b.innerHTML);
  btns.forEach(b=>{ b.innerHTML='Actualizando...'; b.style.opacity='.6'; });
  try{
    const r=await apiCall({action:'listusersfresh',email:SESS.email,pass:SESS.pass});
    if(r.ok) ADMIN_USERS=r.users;
  }catch(e){}
  REFRESCANDO=false;
  btns.forEach((b,i)=>{ b.innerHTML=orig[i]; b.style.opacity=''; });
  renderKeep();   // un solo repintado, conservando la posicion
}
function aprobarTodosClientes(n){
  confirmAction('Aprobar a todos',`¿Aprobar los ${n} clientes pendientes de una vez? Todos tendrán acceso (sin correo masivo).`,'Aprobar a todos',async()=>{
    const pend=(ADMIN_USERS||[]).filter(u=>(u.aprobado||'').toUpperCase().trim()!=='SI' && (u.rol||'').toUpperCase().trim()!=='ADMIN');
    pend.forEach(u=>u.aprobado='SI'); renderKeep();   // se ven aprobados al instante
    for(const u of pend){
      try{ await apiCall({action:'approve',email:SESS.email,pass:SESS.pass,target:u.email}); }catch(e){}
      // NO se manda correo aquí (evita cientos de correos de golpe)
    }
    toast('✓ '+pend.length+' clientes aprobados');
  });
}
// rechazar (ocultar) todos los pendientes de golpe — para limpiar spam/basura
function rechazarTodosPendientes(n){
  confirmAction('Rechazar pendientes',`¿Quitar los ${n} registros pendientes? Se ocultarán de tu lista (no tendrán acceso). Úsalo para limpiar spam o registros basura.`,'Rechazar todos',async()=>{
    // quitar de la vista al instante
    if(ADMIN_USERS){ ADMIN_USERS=ADMIN_USERS.filter(u=>(u.aprobado||'').toUpperCase().trim()==='SI' || (u.rol||'').toUpperCase().trim()==='ADMIN'); }
    renderKeep();
    try{
      const r=await apiCall({action:'rechazartodos',email:SESS.email,pass:SESS.pass});
      if(r.ok){
        if(r.error){ toast('⚠️ Encontró '+r.pendientesEncontrados+' pero falló: '+r.error.slice(0,40)); }
        else { toast('✓ '+(r.total||0)+' de '+(r.pendientesEncontrados||0)+' limpiados'); }
        ADMIN_USERS=null; refrescarDesdeFirebase();
      }
      else{ toast('No se pudo: '+(r.error||'error')); ADMIN_USERS=null; refrescarDesdeFirebase(); }
    }catch(e){ toast('Error: '+((e&&e.message)||e)); ADMIN_USERS=null; refrescarDesdeFirebase(); }
  });
}

function clientsPage(){
  if(!API_URL){return `<div class="page-head"><h1>Clientes</h1></div><div style="color:var(--text-dim);padding:40px">Sube el portal a internet para ver tus clientes reales.</div>`;}
  if(ADMIN_USERS===null){ loadUsers();
    return `<div class="page-head"><h1>Clientes</h1><p>Cargando desde tu hoja...</p></div>
      <div style="color:var(--text-dim);padding:50px;text-align:center">Cargando clientes...</div>`;}
  const users=ADMIN_USERS;
  const up=s=>(s||'').toUpperCase().trim();
  const activos=users.filter(u=>up(u.aprobado)==='SI').length;
  const pend=users.filter(u=>up(u.aprobado)!=='SI').length;
  // pendientes de aprobar arriba de todo; el resto ya viene ordenado (más nuevos primero)
  const ordenados=[...users].sort((a,b)=>{
    const pa=up(a.aprobado)!=='SI'?0:1, pb=up(b.aprobado)!=='SI'?0:1;
    return pa-pb;   // 0 (pendiente) antes que 1 (aprobado); estable conserva el orden por fecha
  });
  const rows = ordenados.length ? ordenados.map(u=>{
    const aprob=up(u.aprobado)==='SI';
    const init=(u.nombre||u.email).split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
    const badge=aprob?'<span class="dot g"></span>Activo':'<span class="dot a"></span>Pendiente';
    const isAdmin=up(u.rol)==='ADMIN';
    const act = isAdmin
      ? '<span style="font-size:11px;color:var(--fire-soft);font-weight:600">ADMIN</span>'
      : aprob
        ? `<button class="ibtn" title="Acceso a productos" onclick='openAccess(${JSON.stringify({e:u.email,n:u.nombre,p:u.productos||""}).replace(/'/g,"&#39;")})'>${sv(I.box,15)}</button>
           <button class="ibtn danger" title="Quitar acceso" onclick="revokeUser('${u.email}')">${sv(I.trash,15)}</button>`
        : `<button class="btn-add" style="padding:7px 13px" onclick="approveUser('${u.email}')">✓ Aprobar</button>
           ${ROL_ACTUAL==='ADMIN_LIMITADO'?'':`<button class="ibtn danger" title="Eliminar usuario" onclick="deleteUser('${u.email}')">${sv(I.trash,15)}</button>`}`;
    return `<div class="trow"><div class="cust-name"><div class="avatar" style="width:30px;height:30px;font-size:11px">${init}</div>
      <div style="min-width:0"><div class="n">${u.nombre||'—'}</div>
        <div class="email-movil">${u.email||''}</div></div></div>
      <div class="cust-email col-hide">${u.email}</div>
      <div class="col-hide" style="font-size:12px;color:var(--text-faint)">${u.ultimo||'—'}</div>
      <div class="col-hide">${badge}</div>
      <div class="row-act">${act}</div></div>`;
  }).join('') : `<div style="padding:40px;text-align:center;color:var(--text-faint)">Aún no hay clientes registrados.</div>`;
  return `<div class="page-head"><h1>Clientes</h1><p>Tus clientes reales. Aprueba o quita acceso con un toque.</p></div>
    <div class="stat-row">
      <div class="stat"><div class="v fire">${users.length}</div><div class="l">Registrados</div></div>
      <div class="stat"><div class="v green">${activos}</div><div class="l">Con acceso</div></div>
      <div class="stat"><div class="v amber">${pend}</div><div class="l">Pendientes</div></div></div>
    <div class="admin-toolbar"><div class="search">${sv(I.search,16)}<input id="cfilter" placeholder="Buscar correo o nombre..." oninput="filterRows()"></div>
      ${pend>0?`<button class="btn-add" onclick="aprobarTodosClientes(${pend})">${sv(I.check,15)} Aprobar a todos (${pend})</button>`:''}
      ${pend>0&&ROL_ACTUAL!=='ADMIN_LIMITADO'?`<button class="btn-ghost" style="color:var(--red);border-color:rgba(255,77,94,.3)" onclick="rechazarTodosPendientes(${pend})">${sv(I.trash,15)} Rechazar pendientes (${pend})</button>`:''}
      <button class="btn-ghost" onclick="refreshUsers()">${sv(I.refresh,15)} Actualizar</button></div>
    <div class="table" id="ctable"><div class="trow head"><div>Cliente</div><div class="col-hide">Correo</div>
      <div class="col-hide">Último acceso</div><div class="col-hide">Estado</div><div style="text-align:right">Acción</div></div>${rows}</div>`;
}

let _dragProdFrom=null;
function dragProdStart(e,idx){ _dragProdFrom=idx; e.dataTransfer.effectAllowed='move';
  e.currentTarget.style.opacity='.4'; }
function dragProdOver(e,idx){ e.preventDefault(); e.dataTransfer.dropEffect='move';
  const row=e.currentTarget; row.style.borderTop=(idx<_dragProdFrom)?'2px solid var(--fire)':'';
  row.style.borderBottom=(idx>_dragProdFrom)?'2px solid var(--fire)':''; }
function dragProdEnd(e){ document.querySelectorAll('.prod-drag').forEach(r=>{r.style.opacity='';r.style.borderTop='';r.style.borderBottom='';}); }
async function dragProdDrop(e,idx){
  e.preventDefault();
  document.querySelectorAll('.prod-drag').forEach(r=>{r.style.borderTop='';r.style.borderBottom='';});
  if(_dragProdFrom===null||_dragProdFrom===idx){ _dragProdFrom=null; return; }
  // mover en el array
  const arr=ADMIN_PRODS;
  const [movido]=arr.splice(_dragProdFrom,1);
  arr.splice(idx,0,movido);
  _dragProdFrom=null;
  renderKeep();   // se ve el nuevo orden al instante
  // guardar el orden en Firebase (campo 'orden' 0,1,2,...)
  try{
    await apiCall({action:'reorderproducts', email:SESS.email, pass:SESS.pass,
      orden: arr.map(p=>p.id).join(',')});
    toast('Orden guardado');
  }catch(e){ toast('No se pudo guardar el orden'); }
}

function setGuideTipo(v){
  document.getElementById('gtipo').value=v;
  document.getElementById('btnGPub').classList.toggle('on',v!=='PRIVADO');
  document.getElementById('btnGPriv').classList.toggle('on',v==='PRIVADO');
  document.getElementById('gAccField').style.display=(v==='PRIVADO'?'block':'none');
  if(v==='PRIVADO')gaccCount();
}
function gaccFilter(q){
  q=(q||'').toLowerCase().trim();
  let vis=0;
  document.querySelectorAll('.gacc-row').forEach(r=>{
    const hit=!q||(r.dataset.s||'').indexOf(q)>=0;
    r.style.display=hit?'':'none';
    if(hit)vis++;
  });
  const box=document.getElementById('gaccBox');
  let none=document.getElementById('gaccNone');
  if(!vis){
    if(!none&&box){none=document.createElement('p');none.id='gaccNone';
      none.style.cssText='color:var(--text-faint);font-size:12.5px;padding:10px 6px;margin:0';
      none.textContent='Ningún cliente con ese nombre.';box.appendChild(none);}
  } else if(none){none.remove();}
  gaccCount();
}
function gaccAll(on){
  // solo los que se ven ahora (respeta la búsqueda)
  document.querySelectorAll('.gacc-row').forEach(r=>{
    if(r.style.display==='none')return;
    const c=r.querySelector('.gacc'); if(c)c.checked=!!on;
  });
  gaccCount();
}
function gaccCount(){
  const el=document.getElementById('gaccInfo'); if(!el)return;
  const n=document.querySelectorAll('.gacc:checked').length;
  const q=(document.getElementById('gaccQ')||{}).value||'';
  el.innerHTML=n?`<b>${n}</b> cliente${n===1?'':'s'} con acceso${q?' · los botones de arriba solo afectan lo que buscaste':''}`:'Ninguno marcado todavía';
  el.className='gacc-info'+(n?' on':'');
}

// ── Borrar TODOS los mensajes basura (sin nombre, correo ni texto) ──
function borrarMsgsBasura(){
  const vacio=x=>!String(x||'').trim() || String(x).trim()==='undefined';
  const basura=(MSGS||[]).filter(m=> vacio(m.mensaje) || (vacio(m.nombre) && vacio(m.email)) );
  if(!basura.length){ toast('No hay mensajes basura'); return; }
  confirmAction('Borrar basura',
    `¿Borrar los ${basura.length} mensajes vacíos? Los mensajes reales no se tocan.`,
    'Borrar', async()=>{
    try{
      // el servidor los busca y borra todos de una vez (no depende del id del cliente)
      const r=await apiCall({action:'deletebasura',email:SESS.email,pass:SESS.pass});
      MSGS=null; render();
      toast(r&&r.ok ? `Listo, ${r.borrados} borrados` : 'No se pudo borrar');
    }catch(e){ toast('No se pudo borrar'); console.warn('[MSG]',e); }
  });
}

let REF_CLOSED={};
try{ REF_CLOSED=JSON.parse(localStorage.getItem('sp_ref_closed')||'{}')||{}; }catch(e){ REF_CLOSED={}; }
function saveRefClosed(){ try{ localStorage.setItem('sp_ref_closed',JSON.stringify(REF_CLOSED)); }catch(e){} }

let LIC_SEL=0, LIC_MODE='pending', ALL_LICS=null, ALL_LICS_LOADING=false;
let LIC_TS='', LIC_ERRORES='';
// Aprobar, quitar y borrar licencias YA van a Railway. Los Apps
// Script de cada producto se quedan solo para atender a los AddOns
// de NinjaTrader: el portal no los necesita para nada.
async function licCall(url,params){
  if (RAILWAY_ON && params && String(params.action||'').indexOf('portal_') === 0) {
    try {
      // saber de que producto es, por su direccion
      const api = LICENSE_APIS.find(x => x.url === url);
      const producto = api ? api.name : '';
      if (!await rwAsegurarSesion()) return { ok:false, error:'NO_ADMIN' };

      if (params.action === 'portal_set') {
        // 'liberar' suelta las PCs para que pueda activar en otra maquina
        if (String(params.liberar||'') === '1') {
          return await rwFetch('/licencias/liberar-pcs',
            { producto, email: params.hwid || params.correo || params.email });
        }
        return await rwFetch('/licencias/acceso', {
          producto,
          email: params.hwid || params.correo || params.email,
          aprobar: String(params.valor||'').toUpperCase() === 'SI',
          maxpcs: params.maxpcs || 0,
          vence: params.vence || ''
        });
      }
      if (params.action === 'portal_delete') {
        return await rwFetch('/licencias/borrar',
          { producto, email: params.hwid || params.correo || params.email });
      }
      // portal_list ya no se usa: la lista entera viene de /licencias
      return { ok:true, licencias: [] };
    } catch(e) {
      console.error('[LICENCIA] fallo:', e);
      return { ok:false, error:'CONN' };
    }
  }
  const qs=Object.keys(params).map(k=>k+'='+encodeURIComponent(params[k])).join('&');
  try{
    const res=await fetch(url+'?'+qs, {redirect:'follow'});
    const txt=await res.text();
    // Apps Script a veces devuelve HTML de error en vez de JSON
    try{ return JSON.parse(txt); }
    catch(parseErr){
      // no era JSON válido → probablemente error del servidor
      return {ok:false, error:'RESP_NO_JSON'};
    }
  }catch(e){
    return {ok:false, error:'CONN'};
  }
}
// El portal ya NO pregunta a los 8 Apps Script. Lee UNA lista que el
// portero recoge solo cada 10 minutos. Una llamada, siempre completa.
async function loadAllData(silent){
  if(ALL_LICS_LOADING)return; ALL_LICS_LOADING=true;
  try{
    // Las licencias viven en Railway: una consulta directa, sin esperar
    // al portero ni a los 8 Apps Script.
    if(!await rwAsegurarSesion()) return;
    const r=await rwFetch('/licencias', null, 'GET');
    if(r.ok && Array.isArray(r.productos) && r.productos.length){
      ALL_LICS=r.productos.map(x=>({licencias:x.licencias||[]}));
      LIC_TS=r.ts||''; LIC_ERRORES=r.errores||'';
      ALL_LICS_LOADING=false;
      pintarLicencias();
      return;
    }
    if(r.ok && r.vacio){
      ALL_LICS_LOADING=false;
      toast('Aún no se han recogido las licencias. Ejecuta activarRecolector() en el portero.');
      return;
    }
  }catch(e){ console.warn('[LICENCIAS] portero no respondió, uso el modo antiguo'); }
  ALL_LICS_LOADING=true;

  // 1) COPIA RÁPIDA: mostrar al instante lo guardado en Firebase
  let mostróCopia=false;
  if(!ALL_LICS){
    try{
      const cache=await apiCall({action:'getliccache'});
      if(cache.ok && cache.data){
        const g=JSON.parse(cache.data);
        if(Array.isArray(g) && g.length===LICENSE_APIS.length){
          ALL_LICS=g.map(d=> d&&d.licencias ? {licencias:d.licencias} : d);
          mostróCopia=true;
          if(view==='admin'&&tab==='alic') renderKeep();   // primera pintura (con copia)
        }
      }
    }catch(e){}
    if(!ALL_LICS) ALL_LICS=LICENSE_APIS.map(()=>null);
  }

  // 2) REAL: consultar los 8 servidores
  const frescos=LICENSE_APIS.map(()=>null);
  await Promise.all(LICENSE_APIS.map(async(api,i)=>{
    if(!api.url||api.url.startsWith('PEGA_AQUI')){ frescos[i]={skip:true}; return; }
    try{ const r=await licCall(api.url,{action:'portal_list',padmin:SESS.email,ppass:SESS.pass});
      frescos[i]= r.ok ? {licencias:r.licencias} : {error:r.error||'ERR'}; }
    catch(e){ frescos[i]={error:'CONN'}; }
  }));
  ALL_LICS=frescos;
  ALL_LICS_LOADING=false;
  frescos.forEach((d,i)=>{ if(d&&d.error)
    console.warn('[LICENCIAS] '+LICENSE_APIS[i].name+' fallo: '+d.error); });
  pintarLicencias();

  // actualizar la vista SIN parpadeo:
  if(view==='admin'&&tab==='alic'){
    // no regenerar si hay un modal abierto (el usuario está aprobando)
    const modalAbierto=document.querySelector('.modal-bg.show');
    if(!modalAbierto){
      if(mostróCopia){ refrescarTablaLic(); actualizarTotalesLic(); }
      else { renderKeep(); }
    }
  }

  // 3) GUARDAR copia — SOLO si los 8 contestaron bien.
  //    Antes se guardaba igualmente, poniendo {licencias:[]} en los que
  //    fallaban. Esa lista vacia quedaba guardada como si fuera real y
  //    por eso "desaparecian" licencias al recargar.
  await guardarCacheLic();
}
// Guarda la copia rapida SOLO si los 8 productos contestaron.
// Si alguno fallo, no se guarda nada: mejor una copia vieja completa
// que una nueva a medias.
async function guardarCacheLic(){
  try{
    const d=ALL_LICS||[];
    const todosOk = d.length===LICENSE_APIS.length &&
                    d.every(x=> x && (x.skip===true || Array.isArray(x.licencias)));
    if(!todosOk){
      console.warn('[LICENCIAS] copia NO guardada: algun producto no contesto');
      return;
    }
    const guardar=d.map(x=>(x&&x.licencias)?{licencias:x.licencias}:{licencias:[]});
    await apiCall({action:'saveliccache', data:JSON.stringify(guardar), email:SESS.email, pass:SESS.pass});
  }catch(e){}
}

function calcTotals(){
  let tot=0,apr=0,pend=0,conn=0;
  (ALL_LICS||[]).forEach(d=>{ if(d&&d.licencias){conn++;tot+=d.licencias.length;apr+=d.licencias.filter(l=>l.aprobado).length;pend+=d.licencias.filter(l=>!l.aprobado).length;} });
  return {tot,apr,pend,conn};
}
function refrescarTablaLic(){
  const w=document.getElementById('licTablaWrap');
  if(w){ w.innerHTML = LIC_MODE==='pending' ? filasPendHTML() : filasProdHTML(); }
}
// recarga las licencias SIN borrar la pantalla (no parpadea)
async function actualizarLicSuave(){
  if(ALL_LICS_LOADING)return;
  ALL_LICS_LOADING=true;
  const scrollY0=window.scrollY;
  try{
    // Las licencias viven en Railway: una consulta directa, sin esperar
    // al portero ni a los 8 Apps Script.
    if(!await rwAsegurarSesion()) return;
    const r=await rwFetch('/licencias', null, 'GET');
    if(r.ok && Array.isArray(r.productos) && r.productos.length){
      ALL_LICS=r.productos.map(x=>({licencias:x.licencias||[]}));
      LIC_TS=r.ts||''; LIC_ERRORES=r.errores||'';
      ALL_LICS_LOADING=false;
      pintarLicencias();
      window.scrollTo(0,scrollY0);
      toast(LIC_ERRORES ? ('Actualizado. Pendiente de reintentar: '+LIC_ERRORES)
                        : ('Licencias actualizadas'+(LIC_TS?' ('+LIC_TS+')':'')));
      return;
    }
  }catch(e){}
  ALL_LICS_LOADING=true;
  const scrollY=window.scrollY;   // recordar dónde está el scroll
  const frescos=LICENSE_APIS.map(()=>null);
  await Promise.all(LICENSE_APIS.map(async(api,i)=>{
    if(!api.url||api.url.startsWith('PEGA_AQUI')){ frescos[i]={skip:true}; return; }
    try{ const r=await licCall(api.url,{action:'portal_list',padmin:SESS.email,ppass:SESS.pass});
      frescos[i]= r.ok ? {licencias:r.licencias} : {error:r.error||'ERR'}; }
    catch(e){ frescos[i]={error:'CONN'}; }
  }));
  ALL_LICS=frescos; ALL_LICS_LOADING=false;
  refrescarTablaLic(); actualizarTotalesLic();
  window.scrollTo(0, scrollY);   // volver a donde estaba
  const malos=[];
  frescos.forEach((d,i)=>{ if(d&&d.error) malos.push(LICENSE_APIS[i].name+' ('+d.error+')'); });
  if(malos.length){
    console.warn('[LICENCIAS] fallaron:', malos.join(' | '));
    toast('⚠️ No contestaron: '+malos.map(x=>x.split(' (')[0]).join(', '));
  } else toast('Licencias actualizadas');
  await guardarCacheLic();
}
async function setLic(pi,hwid,valor,maxpcs){
  const api=LICENSE_APIS[pi];
  const d=ALL_LICS&&ALL_LICS[pi];
  const l=d&&d.licencias&&d.licencias.find(x=>x.hwid===hwid);
  if(!l)return;
  // marcar "guardando..." mientras esperamos al servidor
  l._guardando=true; refrescarTablaLic();
  const params={action:'portal_set',padmin:SESS.email,ppass:SESS.pass,hwid,valor};
  if(maxpcs)params.maxpcs=maxpcs;
  try{
    const r=await licCall(api.url,params);
    l._guardando=false;
    if(r && r.ok===true){
      // el servidor CONFIRMÓ el cambio → ahora sí lo mostramos
      l.aprobado=(valor==='SI'); if(maxpcs)l.maxpcs=parseInt(maxpcs);
      refrescarTablaLic(); actualizarTotalesLic();
      // refrescar en el portero SOLO este producto (rapido, ~2s)
      try{ fetch(MAIL_URL+'?'+new URLSearchParams({accion:'recoger_uno',i:String(pi),
             email:SESS.email,pass:SESS.pass}).toString()); }catch(e){}
      toast(valor==='SI'?'✓ Licencia activada':'Licencia desactivada');
    } else {
      // el servidor NO guardó → decimos POR QUE, que "no se guardó" no ayuda
      refrescarTablaLic();
      const cod=(r&&r.error)||'DESCONOCIDO';
      const motivos={
        NO_ENCONTRADO:'No encuentro esa fila en la hoja. El correo del portal y el de la hoja no coinciden (revisa espacios o caracteres raros).',
        NO_ADMIN:'El servidor de ese producto no te reconoce como admin. Revisa que tenga la última versión implementada.',
        SIN_DATO:'Llegó sin el correo. Recarga la página e inténtalo otra vez.',
        RESP_NO_JSON:'Ese script devolvió un error. Míralo en su editor (Ejecuciones).',
        CONN:'No hay conexión con ese servidor.'
      };
      console.warn('[LICENCIA] fallo al guardar:', cod, 'hwid=', JSON.stringify(hwid), 'producto=', api.nombre||pi);
      toast('⚠️ '+(motivos[cod]||('El servidor respondió: '+cod)));
    }
  }catch(e){
    l._guardando=false; refrescarTablaLic();
    toast('⚠️ Sin conexión con el servidor. No se guardó.');
  }
}
function approveLic(pi,hwid){
  const api=LICENSE_APIS[pi];
  if(api.pcs){ openPcs(pi,hwid); } else setLic(pi,hwid,'SI');
}
// aprueba TODAS las licencias pendientes de todos los productos
function aprobarTodasLic(){
  let pend=[];
  (ALL_LICS||[]).forEach((d,pi)=>{ if(d&&d.licencias){ d.licencias.filter(l=>!l.aprobado).forEach(l=>pend.push({l,pi})); } });
  if(!pend.length)return;
  const conPcs=pend.some(x=>LICENSE_APIS[x.pi].pcs);
  const nota=conPcs?' Los productos que usan PCs se aprobarán con 1 PC (luego puedes subirlas).':'';
  confirmAction('Aprobar todas',`¿Aprobar las ${pend.length} licencias pendientes de una vez?${nota}`,'Aprobar todas',async()=>{
    pend.forEach(({l,pi})=>{ l.aprobado=true; if(LICENSE_APIS[pi].pcs && !l.maxpcs) l.maxpcs=1; });
    renderKeep();
    for(const {l,pi} of pend){
      const api=LICENSE_APIS[pi];
      const params={action:'portal_set',padmin:SESS.email,ppass:SESS.pass,hwid:l.hwid,valor:'SI'};
      if(api.pcs)params.maxpcs=(l.maxpcs&&l.maxpcs>0)?l.maxpcs:1;
      try{ await licCall(api.url,params); }catch(e){}
    }
    await guardarCacheLic();
    toast('Listo, licencias aprobadas');
  });
}
// ── Borrar TODAS las licencias pendientes (las que no estan aprobadas) ──
function borrarTodasLicPend(){
  let pend=[];
  (ALL_LICS||[]).forEach((d,pi)=>{ if(d&&d.licencias){ d.licencias.filter(l=>!l.aprobado).forEach(l=>pend.push({l,pi})); } });
  if(!pend.length){ toast('No hay pendientes'); return; }
  confirmAction('Borrar pendientes',
    `¿Borrar las ${pend.length} licencias pendientes? Se eliminan de las hojas. Las APROBADAS no se tocan.`,
    'Borrar todas', async()=>{
    let n=0, fallos=0, errores={};
    const total=pend.length;
    toast(`Borrando ${total}... no cierres esta pestaña`);

    for(let i=0;i<pend.length;i++){
      const {l,pi}=pend[i];
      const api=LICENSE_APIS[pi];
      if(!api){ fallos++; errores['SIN_API']=(errores['SIN_API']||0)+1; continue; }

      let r=null;
      for(let intento=0;intento<2;intento++){
        r=await licCall(api.url,{action:'portal_delete',padmin:SESS.email,ppass:SESS.pass,hwid:l.hwid});
        // NO_ENCONTRADO tambien vale: ya no esta en la hoja
        if(r && (r.ok || r.error==='NO_ENCONTRADO')) break;
        await new Promise(res=>setTimeout(res,600));   // esperar antes de reintentar
      }

      if(r && (r.ok || r.error==='NO_ENCONTRADO')){
        n++;
        // quitar de la vista solo lo que de verdad se borro
        const d=ALL_LICS&&ALL_LICS[pi];
        if(d&&d.licencias) d.licencias=d.licencias.filter(x=>x.hwid!==l.hwid);
      } else {
        fallos++;
        const cod=(r&&r.error)||'DESCONOCIDO';
        errores[cod]=(errores[cod]||0)+1;
      }

      if(i%10===0){
        console.log('[BORRAR LIC] '+(i+1)+' / '+total+'  ok:'+n+'  fallos:'+fallos);
        renderKeep();
      }
      await new Promise(res=>setTimeout(res,250));   // pausa: Apps Script corta si vas muy rapido
    }

    await guardarCacheLic();
    renderKeep();
    if(fallos) console.warn('[BORRAR LIC] errores:', errores);
    toast(fallos ? `Borradas ${n}, fallaron ${fallos} (mira F12)` : `Listo, ${n} pendientes borradas`);
  });
}
