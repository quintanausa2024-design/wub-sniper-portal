  const now=Date.now();
  if(!force && _usersCache && (now-_usersCacheT)<600000) return _usersCache;   // 10 min en memoria
  // intentar caché del navegador (evita releer al recargar la página)
  if(!force){
    try{
      const raw=localStorage.getItem('sp_users_cache');
      const rawT=parseInt(localStorage.getItem('sp_users_cache_t')||'0');
      if(raw && (now-rawT)<600000){
        _usersCache=JSON.parse(raw); _usersCacheT=rawT;
        return _usersCache;
      }
    }catch(e){}
  }
  // La lista viene del PORTERO y llega SIN pass_hash. Antes se bajaba
  // la coleccion entera desde el navegador, hashes incluidos, y se
  // guardaba en localStorage: cualquiera con F12 la veia.
  const qs=new URLSearchParams({accion:'lista_clientes',
    email:(SESS&&SESS.email)||'',pass:(SESS&&SESS.pass)||''}).toString();
  const rr=await (await fetch(MAIL_URL+'?'+qs)).json();
  if(!rr.ok) return _usersCache||[];
  _usersCache=rr.clientes||[];
  _usersCacheT=now;
  // Si la lectura vino a medias, NO la guardamos: si no, te quedas 10
  // minutos viendo una lista corta creyendo que esa es toda.
  if(rr.incompleta){
    console.warn('[CLIENTES] lectura incompleta, no se guarda en cache');
    _usersCacheT=0;
    return _usersCache;
  }
  try{ localStorage.setItem('sp_users_cache', JSON.stringify(_usersCache));
       localStorage.setItem('sp_users_cache_t', String(now)); }catch(e){}
  return _usersCache;
}
function invalidateUsers(){
  _usersCache=null;
  try{ localStorage.removeItem('sp_users_cache'); localStorage.removeItem('sp_users_cache_t'); }catch(e){}
}
// actualiza UN usuario en el caché sin releer los 386 (ahorra lecturas)
function actualizarUserEnCache(email, cambios){
  if(_usersCache){
    const u=_usersCache.find(x=>x.email===email);
    if(u) Object.assign(u, cambios);
    try{ localStorage.setItem('sp_users_cache', JSON.stringify(_usersCache)); }catch(e){}
  }
}
function borrarUserDeCache(email){
  if(_usersCache){
    _usersCache=_usersCache.filter(x=>x.email!==email);
    try{ localStorage.setItem('sp_users_cache', JSON.stringify(_usersCache)); }catch(e){}
  }
}

// Lee UN cliente por el PORTERO. Ya NO trae pass_hash: ese campo no
// sale del servidor. Si necesitas comprobar la contrasena, usa authUser.
async function getUser(email){
  try{
    const qs=new URLSearchParams({accion:'cliente_uno',email:String(email||'').toLowerCase().trim()}).toString();
    const r=await (await fetch(MAIL_URL+'?'+qs)).json();
    return r.ok ? r.cliente : null;
  }catch(e){ return null; }
}
// Comprueba correo+contrasena EN EL SERVIDOR y devuelve el cliente.
// Devuelve null si la contrasena no es correcta.
async function authUser(email,pass){
  try{
    const qs=new URLSearchParams({accion:'cliente_auth',
      email:String(email||'').toLowerCase().trim(),pass:pass||''}).toString();
    const r=await (await fetch(MAIL_URL+'?'+qs)).json();
    return r.ok ? r.cliente : null;
  }catch(e){ return null; }
}
// ── Quien eres lo dice RAILWAY ─────────────────────────────
// Los clientes ya viven ahi. Estas funciones las usan trozos del
// portal que siguen en Firebase (guias, resenas, catalogo), y
// tienen que preguntar donde estan los datos de verdad: si no,
// quien se registre nuevo "no existe" para ellas.
async function quienSoyRailway(email, pass){
  try{
    const r = await fetch(RAILWAY_URL + '/auth/login', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ email, pass })
    }).then(x=>x.json());
    if (!r.ok) return null;
    return { email, nombre:r.cliente.nombre||'', rol:r.cliente.rol||'CLIENTE',
             productos:r.cliente.productos||'', aprobado:'SI' };
  }catch(e){ return null; }
}

async function verifyAdmin(email,pass){
  const u=await quienSoyRailway(email,pass);
  return !!u && (u.rol||'').toUpperCase()==='ADMIN';
}

// Igual que verifyAdmin pero TAMBIEN deja pasar al socio (ADMIN_LIMITADO).
// Solo se usa en las acciones que le tocan: ver clientes, aprobar/quitar
// acceso y dar productos. Todo lo demas sigue exigiendo ADMIN total.
async function verifyAdminAny(email,pass){
  const u=await quienSoyRailway(email,pass);
  if(!u) return false;
  const rol=(u.rol||'').toUpperCase();
  return rol==='ADMIN' || rol==='ADMIN_LIMITADO';
}

// lee una colección entera → array
async function getCol(name){
  const snap=await getDocs(collection(db,name));
  // _docid = id REAL del documento en Firestore (los datos basura no traen campo 'id')
  return snap.docs.map(d=>({ ...d.data(), _docid:d.id }));
}

// ═══════════════════════════════════════════════════════════════
//  ROUTER PRINCIPAL — recibe {action, ...} y devuelve el mismo
//  formato JSON que antes daba Apps Script
// ═══════════════════════════════════════════════════════════════
// ── Escrituras de admin: van por el PORTERO, no directo a Firestore.
//    Asi las reglas de Firestore pueden quedar cerradas y nadie que
//    copie la clave del HTML puede escribir en la base.
async function pSet(col,id,datos,email,pass){
  const qs=new URLSearchParams({accion:'admin_set',col,id,
    datos:JSON.stringify(datos||{}),email:email||'',pass:pass||''}).toString();
  const r=await fetch(MAIL_URL+'?'+qs);
  return await r.json();
}
async function pDel(col,id,email,pass){
  const qs=new URLSearchParams({accion:'admin_del',col,id,
    email:email||'',pass:pass||''}).toString();
  const r=await fetch(MAIL_URL+'?'+qs);
  return await r.json();
}

window.fbCall = async function(p){
  const a = p.action;
  try {

    // ---------- LOGIN ----------
    if(a==='login'){
      const u=await authUser(p.email,p.pass);
      if(!u) return {ok:false,error:'WRONGPASS'};
      if((u.aprobado||'').toUpperCase()!=='SI') return {ok:false,error:'PENDING'};
      // el último acceso lo apunta el portero al validar la contraseña
      return {ok:true, role:(u.rol||'CLIENTE').toUpperCase(), name:u.nombre||''};
    }

    // ---------- SIGNUP ----------
    // El registro YA NO escribe en Firebase desde el navegador.
    // Va al PORTERO (Apps Script), que valida y escribe con clave de servidor.
    if(a==='signup'){
      const qs = new URLSearchParams({
        accion:'signup',
        email:(p.email||'').toLowerCase().trim(),
        pass:p.pass||'',
        nombre:p.nombre||'',
        ref:p.ref||''
      }).toString();
      try{
        const res = await fetch(MAIL_URL+'?'+qs);
        const r = await res.json();
        invalidateUsers();
        return r;
      }catch(e){
        console.warn('[PORTERO] signup fallo', e);
        return {ok:false, error:'CONN'};
      }
    }

    // ---------- CAMBIAR / RESET PASSWORD ----------
    if(a==='changepass'){
      // el hash se calcula y se guarda EN EL PORTERO
      const qs=new URLSearchParams({accion:'cambiar_pass',modo:'normal',
        email:p.email,oldpass:p.oldpass||p.pass||'',newpass:p.newpass}).toString();
      const r=await (await fetch(MAIL_URL+'?'+qs)).json();
      if(r.ok) invalidateUsers();
      return r;
    }
    if(a==='reset'){
      // El PORTERO genera la temporal y la manda por correo. El navegador
      // ya no la elige: antes cualquiera podia resetear cualquier cuenta.
      const qs=new URLSearchParams({accion:'olvide_pass',
        email:(p.email||'').toLowerCase().trim()}).toString();
      const r=await (await fetch(MAIL_URL+'?'+qs)).json();
      invalidateUsers();
      return r;
    }
    // el admin resetea la clave de un cliente
    if(a==='adminreset'){
      const em=(p.target||'').toLowerCase().trim();
      const u=await getUser(em);
      if(!u) return {ok:false,error:'NOTFOUND'};
      const qs=new URLSearchParams({accion:'cambiar_pass',modo:'admin',
        email:em,newpass:p.newpass,
        admin_email:p.email,admin_pass:p.pass}).toString();
      const r=await (await fetch(MAIL_URL+'?'+qs)).json();
      if(!r.ok) return r;
      invalidateUsers();
      return {ok:true, nombre:u.nombre||''};
    }

    // ---------- LISTAR PRODUCTOS (cliente) ----------
    if(a==='listproducts'){
      // Quien eres y que tienes liberado lo dice RAILWAY (ahi viven los
      // clientes ahora). El catalogo de productos sigue en Firebase.
      // Sin esto, quien se registra nuevo no existe en Firebase y no
      // veria NINGUN producto.
      const u = await quienSoyRailway(p.email, p.pass);
      if(!u) return {ok:false,error:'WRONGPASS'};
      if((u.aprobado||'').toUpperCase()!=='SI') return {ok:false,error:'PENDING'};
      const liberados=(u.productos||'').split(',').map(x=>x.trim()).filter(Boolean);
      const prods=await getCol('productos');
      prods.sort((a,b)=>(a.orden!==undefined?a.orden:9999)-(b.orden!==undefined?b.orden:9999));
      const out=prods.map(pr=>{
        const can = (pr.tipo==='PUBLICO') || liberados.includes(pr.id);
        return { id:pr.id, nombre:pr.nombre, descripcion:pr.descripcion, video:pr.video,
          tipo:pr.tipo, precio:pr.precio, fotos:pr.fotos,
          canDownload:can, download:can?pr.download:'', telegram:can?pr.telegram:'' };
      });
      return {ok:true, products:out};
    }

    // ---------- ADMIN: PRODUCTOS ----------
    if(a==='adminproducts'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      const prods=await getCol('productos');
      prods.sort((a,b)=>(a.orden!==undefined?a.orden:9999)-(b.orden!==undefined?b.orden:9999));
      return {ok:true, products:prods};
    }
    if(a==='addproduct' || a==='editproduct'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      const id = a==='addproduct' ? ('p'+Date.now()) : p.pid;
      let orden = 9999;
      if(a==='editproduct'){ const prev=(await getDoc(doc(db,'productos',id))).data(); if(prev&&prev.orden!==undefined)orden=prev.orden; }
      else { const all=await getCol('productos'); orden=all.length; }
      // si al editar llega vacia, se conserva la que ya estaba (evita borrados accidentales)
      let descFinal=(p.desc||'').trim();
      if(a==='editproduct' && !descFinal){
        try{ const ant=(await getDoc(doc(db,'productos',id))).data();
             if(ant && ant.descripcion) descFinal=ant.descripcion; }catch(e){}
      }
      const obj={ id, nombre:(p.nombre||'').trim(), descripcion:descFinal,
        video:(p.video||'').trim(), download:(p.download||'').trim(),
        tipo:(p.tipo||'PUBLICO').toUpperCase().trim(), precio:(p.precio||'').trim(),
        fotos:(p.fotos||'').trim(), telegram:(p.telegram||'').trim(), orden };
      { const r=await pSet('productos',id,obj,p.email,p.pass); if(!r.ok) return r; }
      if(a==='addproduct'){ await pSet('config','newprod',{id,nombre:obj.nombre,ts:Date.now()},p.email,p.pass); }
      return {ok:true, id};
    }
    // guardar el nuevo orden de los productos (por arrastre)
    if(a==='reorderproducts'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      const ids=(p.orden||'').split(',').filter(Boolean);
      for(let i=0;i<ids.length;i++){
        try{ const ant=await getDoc(doc(db,'productos',ids[i]));
             if(!ant.exists()) continue;
             await pSet('productos',ids[i],{...ant.data(),orden:i},p.email,p.pass); }catch(e){}
      }
      return {ok:true};
    }
    if(a==='deleteproduct'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      return await pDel('productos',p.pid,p.email,p.pass);
    }

    // ---------- USUARIOS (admin) ----------
    if(a==='listusers' || a==='listusersfresh'){
      if(!await verifyAdminAny(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      if(a==='listusersfresh') invalidateUsers();   // forzar lectura fresca de Firebase
      const all=await getAllUsers(a==='listusersfresh');   // usa caché (no fuerza lectura de 386 docs cada vez)
      // ocultar los rechazados (basura/spam marcado)
      const visibles=all.filter(u=>(u.aprobado||'').toUpperCase()!=='RECHAZADO');
      const users=visibles.map(u=>({ email:u.email, nombre:u.nombre, rol:u.rol,
        aprobado:u.aprobado, registro:u.fecha_registro, ultimo:u.ultimo_acceso, productos:u.productos||'' }));
      // ordenar: más nuevos primero (por fecha de registro dd/mm/aaaa hh:mm)
      const parseF=s=>{ if(!s)return 0;
        const m=String(s).match(/(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
        if(!m)return 0;
        return new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0)).getTime();
      };
      users.sort((x,y)=>parseF(y.registro)-parseF(x.registro));
      // aprovecha que ya leimos todo: guarda el conteo para que getstats no relea
      try{
        const reales=all.filter(u=>(u.rol||'').toUpperCase()!=='ADMIN'
                                && (u.aprobado||'').toUpperCase()==='SI').length;
        const sc=await getDoc(doc(db,'config','stats'));
        const cur=sc.exists()?sc.data():{};
        if(cur.reales!==reales) await pSet('config','stats',{...cur,reales},p.email,p.pass);
      }catch(e){}
      return {ok:true, users};
    }
    if(a==='approve' || a==='revoke'){
      if(!await verifyAdminAny(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      const em=p.target.toLowerCase().trim();
      const qs=new URLSearchParams({accion:a==='approve'?'approve':'revoke',
        email:em,padmin:p.email,ppass:p.pass}).toString();
      const r=await (await fetch(MAIL_URL+'?'+qs)).json();
      if(!r.ok) return r;
      actualizarUserEnCache(em,{aprobado: a==='approve'?'SI':'NO'});
      return {ok:true};
    }
    // marcar TODOS los pendientes como rechazados (se ocultan de la lista, no se borran)
    if(a==='rechazartodos'){
      // lo hace el PORTERO de una pasada; el navegador ya no escribe en 'clientes'
      const qs=new URLSearchParams({accion:'rechazar_todos',
        email:p.email,pass:p.pass}).toString();
      const r=await (await fetch(MAIL_URL+'?'+qs)).json();
      if(!r.ok) return r;
      invalidateUsers();
      return {ok:true, total:r.n||0, pendientesEncontrados:r.n||0, error:''};
    }
    if(a==='deleteuser'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      const em=p.target.toLowerCase().trim();
      const qs=new URLSearchParams({accion:'borrarcliente',
        email:em,padmin:p.email,ppass:p.pass}).toString();
      const r=await (await fetch(MAIL_URL+'?'+qs)).json();
      if(!r.ok) return r;
      borrarUserDeCache(em);
      return {ok:true};
    }
    if(a==='setclientproducts'){
      if(!await verifyAdminAny(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      const em=p.target.toLowerCase().trim();
      const prev=await getUser(em);
      if(!prev) return {ok:false,error:'NOTFOUND'};
      const r=await pSet('clientes',em,{...prev,productos:p.productos||''},p.email,p.pass);
      if(!r.ok) return r;
      actualizarUserEnCache(em,{productos:p.productos||''});
      return {ok:true};
    }

    // ---------- GUÍAS ----------
    if(a==='listguides'){
      const guias=await getCol('guias');
      let esAdm=false, quien='';
      if(p.email && p.pass){
        const u=await quienSoyRailway(p.email,p.pass);
        if(u && (u.aprobado||'').toUpperCase()==='SI'){
          quien=p.email.toLowerCase().trim(); esAdm=(u.rol||'').toUpperCase()==='ADMIN';
        }
      }
      const out=[];
      for(const g of guias){
        const tipo=(g.tipo||'PUBLICO').toUpperCase();
        const acceso=(g.acceso||'').toLowerCase();
        let puede=true;
        if(tipo==='PRIVADO' && !esAdm){
          puede=false;
          if(quien) puede=acceso.split(',').map(x=>x.trim()).includes(quien);
        }
        if(!puede) continue;
        out.push({ id:g.id, titulo:g.titulo, descripcion:g.descripcion, video:g.video,
          tipo, acceso: esAdm?(g.acceso||''):'' });
      }
      return {ok:true, guides:out};
    }
    if(a==='addguide' || a==='editguide'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      const id = a==='addguide' ? ('g'+Date.now()) : p.gid;
      const r=await pSet('guias',id,{ id, titulo:(p.titulo||'').trim(),
        descripcion:(p.desc||'').trim(), video:(p.video||'').trim(),
        tipo:(p.tipo||'PUBLICO').toUpperCase().trim(), acceso:(p.acceso||'').toLowerCase().trim() },p.email,p.pass);
      if(!r.ok) return r;
      return {ok:true, id};
    }
    if(a==='deleteguide'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      return await pDel('guias',p.gid,p.email,p.pass);
    }

    // ---------- DESCUENTOS ----------
    if(a==='listdiscounts'){
      const ds=await getCol('descuentos');
      const out=ds.filter(d=>(d.visible||'SI').toUpperCase()!=='NO').map(d=>({
        id:d.id, empresa:d.empresa, descuento:d.descuento, codigo:d.codigo,
        link:d.link, nota:d.nota, tipo:(d.tipo||'DESCUENTO').toUpperCase() }));
      return {ok:true, discounts:out};
    }
    if(a==='listdiscountsadmin'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      const ds=await getCol('descuentos');
      return {ok:true, discounts:ds.map(d=>({ id:d.id, empresa:d.empresa, descuento:d.descuento,
        codigo:d.codigo, link:d.link, nota:d.nota, tipo:(d.tipo||'DESCUENTO').toUpperCase(),
        visible:(d.visible||'SI').toUpperCase()!=='NO' })) };
    }
    if(a==='adddiscount' || a==='editdiscount'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      const id = a==='adddiscount' ? ('d'+Date.now()) : p.did;
      const prev = a==='editdiscount' ? (await getDoc(doc(db,'descuentos',id))).data()||{} : {};
      const r=await pSet('descuentos',id,{ id, empresa:(p.empresa||'').trim(),
        descuento:(p.descuento||'').trim(), codigo:(p.codigo||'').trim(), link:(p.link||'').trim(),
        nota:(p.nota||'').trim(), tipo:(p.tipo||'DESCUENTO').toUpperCase().trim(),
        visible: prev.visible!==undefined?prev.visible:'SI' },p.email,p.pass);
      if(!r.ok) return r;
      return {ok:true, id};
    }
    if(a==='setdiscvisible'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      const ant=await getDoc(doc(db,'descuentos',p.did));
      if(!ant.exists()) return {ok:false,error:'NO_ENCONTRADO'};
      return await pSet('descuentos',p.did,{...ant.data(),visible: p.valor==='SI'?'SI':'NO'},p.email,p.pass);
    }
    if(a==='deletediscount'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      return await pDel('descuentos',p.did,p.email,p.pass);
    }

    // ---------- RESEÑAS ----------
    if(a==='listreviews'){
      const rs=await getCol('resenas');
      const out=rs.filter(r=>(r.aprobado||'').toUpperCase()==='SI').map(r=>({
        id:r.id, fecha:r.fecha, nombre:r.nombre, pid:String(r.pid||''),
        estrellas:Number(r.estrellas||0), texto:r.texto }));
      out.reverse();
      return {ok:true, reviews:out};
    }
    if(a==='listreviewsadmin'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      const rs=await getCol('resenas');
      rs.reverse();
      return {ok:true, reviews:rs.map(r=>({ id:r.id, fecha:r.fecha, email:r.email, nombre:r.nombre,
        pid:String(r.pid||''), producto:r.producto, estrellas:Number(r.estrellas||0),
        texto:r.texto, aprobado:(r.aprobado||'').toUpperCase()==='SI' })) };
    }
    if(a==='addreview'){
      const u=await quienSoyRailway(p.email,p.pass);
      if(!u) return {ok:false,error:'WRONGPASS'};
      // debe tener acceso al producto
      const liberados=(u.productos||'').split(',').map(x=>x.trim()).filter(Boolean);
      if(!liberados.includes(p.pid)) return {ok:false,error:'NO_ACCESS'};
      // buscar si ya tiene reseña de ese producto → actualiza
      // la escribe el PORTERO: comprueba clave y acceso al producto
      const qs=new URLSearchParams({accion:'resena_nueva',email:p.email,pass:p.pass,
        pid:String(p.pid),producto:p.producto||'',estrellas:String(p.estrellas||5),
        texto:(p.texto||'').slice(0,600)}).toString();
      return await (await fetch(MAIL_URL+'?'+qs)).json();
    }
    if(a==='setreview'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      const ant=await getDoc(doc(db,'resenas',p.rid));
      if(!ant.exists()) return {ok:false,error:'NO_ENCONTRADO'};
      return await pSet('resenas',p.rid,{...ant.data(),aprobado: p.valor==='SI'?'SI':'NO'},p.email,p.pass);
    }
    if(a==='deletereview'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      return await pDel('resenas',p.rid,p.email,p.pass);
    }

    // ---------- NOTICIAS ----------
    if(a==='listnews'){
      const ns=await getCol('noticias'); ns.reverse();
      return {ok:true, news:ns.map(n=>({ id:n.id, fecha:n.fecha, tag:n.tag,
        titulo:n.titulo, cuerpo:n.cuerpo, color:n.color })) };
    }
    if(a==='addnews'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      const id='n'+Date.now();
      const r=await pSet('noticias',id,{ id, fecha:nowStr(), tag:(p.tag||'AVISO').trim(),
        titulo:(p.titulo||'').trim(), cuerpo:(p.cuerpo||'').trim(), color:(p.color||'').trim() },p.email,p.pass);
      if(!r.ok) return r;
      return {ok:true, id};
    }
    if(a==='editnews'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      const prev=await getDoc(doc(db,'noticias',p.nid));
      const cur=prev.exists()?prev.data():{};
      return await pSet('noticias',p.nid,{ ...cur, id:p.nid, tag:(p.tag||'AVISO').trim(),
        titulo:(p.titulo||'').trim(), cuerpo:(p.cuerpo||'').trim(), color:(p.color||'').trim() },p.email,p.pass);
    }
    if(a==='deletenews'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      return await pDel('noticias',p.nid,p.email,p.pass);
    }

    // ---------- MENSAJES / CONTACTO ----------
    // PUERTA CERRADA: este endpoint no pedia NADA (ni cuenta, ni freno, ni
    // validacion) y por ahi entraba el spam. Los mensajes ahora se mandan
    // por el portero (accion=contacto), que si comprueba quien escribe.
    if(a==='contact'){
      return {ok:false,error:'USA_PORTERO'};
    }
    if(a==='listmessages'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      const qs=new URLSearchParams({accion:'lista_mensajes',email:p.email,pass:p.pass}).toString();
      const rr=await (await fetch(MAIL_URL+'?'+qs)).json();
      if(!rr.ok) return rr;
      const ms=(rr.mensajes||[]).slice().reverse();
      return {ok:true, messages:ms.map(m=>({ id:m.id, fecha:m.fecha, nombre:m.nombre,
        email:m.email, mensaje:m.mensaje, telefono:m.telefono||'' })) };
    }
    if(a==='deletemessage'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      const mid=String(p.mid||'').trim();
      if(!mid || mid==='undefined') return {ok:false,error:'SIN_ID'};
      return await pDel('mensajes',mid,p.email,p.pass);
    }
    // borra de golpe todos los mensajes basura (sin tener que pasar cada id)
    if(a==='deletebasura'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      const qs=new URLSearchParams({accion:'lista_mensajes',email:p.email,pass:p.pass}).toString();
      const rr=await (await fetch(MAIL_URL+'?'+qs)).json();
      if(!rr.ok) return rr;
      let n=0;
      for(const m of (rr.mensajes||[])){
        const d={id:m.id};
        const vacio=x=>!String(x||'').trim();
        const esBasura = vacio(m.mensaje) || (vacio(m.nombre)&&vacio(m.email))
                       || ('_persistent' in m) || ('_backup' in m)
                       || String(m.remitente||'').includes('persistence');
        if(esBasura){ try{ const r=await pDel('mensajes',d.id,p.email,p.pass); if(r.ok) n++; }catch(e){} }
      }
      return {ok:true, borrados:n};
    }

    // ---------- REFERIDOS ----------
    if(a==='mireferido'){
      const u=await getUser(p.email);
      if(!u) return {ok:false,error:'NOTFOUND'};
      const all=await getAllUsers();
      const misRefs=all.filter(x=>(x.referido_por||'').toUpperCase()===(u.mi_codigo||'').toUpperCase());
      return {ok:true, codigo:u.mi_codigo||'', total:misRefs.length};
    }
    if(a==='listreferidos'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      const all=await getAllUsers();
      const prods=await getCol('productos');
      const pmap={}; prods.forEach(pr=>pmap[pr.id]=pr.nombre);
      const porCod={};
      all.forEach(u=>{ if(u.mi_codigo) porCod[u.mi_codigo.toUpperCase()]={nombre:u.nombre,email:u.email,codigo:u.mi_codigo,refs:[]}; });
      all.forEach(u=>{
        const rb=(u.referido_por||'').toUpperCase();
        if(rb && porCod[rb]){
          const ids=(u.productos||'').split(',').map(x=>x.trim()).filter(Boolean);
          porCod[rb].refs.push({ nombre:u.nombre, email:u.email, fecha:u.fecha_registro,
            aprobado:(u.aprobado||'').toUpperCase()==='SI', productos:ids.map(i=>pmap[i]||i) });
        }
      });
      const out=Object.values(porCod).filter(x=>x.refs.length);
      out.sort((a,b)=>b.refs.length-a.refs.length);
      return {ok:true, referidos:out};
    }

    // ---------- CONFIG: mantenimiento, stats, nuevo producto ----------
    if(a==='getmaint'){
      const s=await getDoc(doc(db,'config','maint'));
      const d=s.exists()?s.data():{};
      return {ok:true, maint:!!d.on, msg:d.msg||''};
    }
    if(a==='setmaint'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      return await pSet('config','maint',{on:p.on==='SI', msg:(p.msg||'').slice(0,300)},p.email,p.pass);
    }
    if(a==='getnewprod'){
      const s=await getDoc(doc(db,'config','newprod'));
      const d=s.exists()?s.data():{};
      return {ok:true, id:d.id||'', nombre:d.nombre||'', ts:d.ts||''};
    }
    if(a==='getstats'){
      const s=await getDoc(doc(db,'config','stats'));
      const d=s.exists()?s.data():{};
      // usa el numero guardado (1 lectura) en vez de leer toda la coleccion
      const reales = typeof d.reales==='number' ? d.reales : 0;
      return {ok:true, reales,
        clientes:d.clientes||'', anios:d.anios||'', productos:d.productos||'',
        pay_zelle: d.pay_zelle!==false, pay_paypal: d.pay_paypal!==false,
        pay_tarjeta: d.pay_tarjeta!==false };
    }
    if(a==='setstats'){
      if(!await verifyAdmin(p.email,p.pass)) return {ok:false,error:'NO_ADMIN'};
      const s=await getDoc(doc(db,'config','stats'));
      const cur=s.exists()?s.data():{};
      const upd={...cur};
      if(p.clientes!==undefined) upd.clientes=p.clientes;
      if(p.anios!==undefined) upd.anios=p.anios;
      if(p.productos!==undefined) upd.productos=p.productos;
      if(p.pay_zelle!==undefined) upd.pay_zelle=(p.pay_zelle==='SI');
      if(p.pay_paypal!==undefined) upd.pay_paypal=(p.pay_paypal==='SI');
      if(p.pay_tarjeta!==undefined) upd.pay_tarjeta=(p.pay_tarjeta==='SI');
      return await pSet('config','stats',upd,p.email,p.pass);
    }

    // ---------- noticias de mercado (esas quedan sin datos por ahora) ----------
    if(a==='marketnews') return {ok:true, news:[]};
    if(a==='marketcal')  return {ok:true, eventos:[]};

    // ---------- COPIA RÁPIDA DE LICENCIAS (para verlas al instante) ----------
    // guardar la foto de las 8 licencias en Firebase
    if(a==='saveliccache'){
      try{
        await pSet('config','lic_cache',{ data: p.data||'[]', ts: Date.now() },p.email,p.pass);
        return {ok:true};
      }catch(e){ return {ok:false, error:'SAVE_FAIL'}; }
    }
    // leer la foto guardada
    if(a==='getliccache'){
      try{
        const s=await getDoc(doc(db,'config','lic_cache'));
        if(!s.exists()) return {ok:true, data:null};
        const d=s.data();
        return {ok:true, data:d.data||null, ts:d.ts||0};
      }catch(e){ return {ok:true, data:null}; }
    }

    return {ok:false, error:'ACCION_DESCONOCIDA:'+a};

  } catch(err){
    console.error('fbCall error', a, err);
    return {ok:false, error:'FB_ERROR:'+(err.message||err)};
  }
};

// Avisar a la pagina de que Firebase ya esta listo. Asi apiCall arranca
// al instante en vez de estar preguntando cada 50 ms.
try{ window.dispatchEvent(new Event('fb-listo')); }catch(e){}

</script>
</body>
</html>
