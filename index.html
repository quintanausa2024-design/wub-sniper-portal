<style>
  :root{
    --bg:#06090F;--bg-2:#0A0E16;--surface:#111824;--surface-2:#151E2C;
    --line:#1F2A3A;--line-soft:#16202E;
    --text:#F4F8FD;--text-dim:#A8B6C9;--text-faint:#6D7C90;
    --fire:#FF6B2C;--fire-soft:#FF8A4C;--cyan:#34B3FF;--cyan-soft:#6FCBFF;
    --green:#27D796;--red:#FF4D5E;--amber:#FFC247;
    --display:'Space Grotesk',sans-serif;--body:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);font-family:var(--body);
    -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;position:relative;
  }
  /* ambient background (estático, para no cargar el CPU) */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(800px 500px at 78% -8%, rgba(255,107,44,.10), transparent 60%),
      radial-gradient(700px 500px at 12% 108%, rgba(52,179,255,.09), transparent 60%),
      radial-gradient(600px 600px at 50% 50%, rgba(52,179,255,.03), transparent 70%);
  }
  /* rejilla futurista (estática) */
  .grid-bg{
    position:fixed;inset:-2px;z-index:0;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(rgba(52,179,255,.055) 1px,transparent 1px),
      linear-gradient(90deg,rgba(52,179,255,.055) 1px,transparent 1px);
    background-size:52px 52px;
    -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 78%);
    mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 78%);
  }
  @keyframes gridmove{0%{background-position:0 0,0 0}100%{background-position:52px 52px,52px 52px}}
  /* barrido de escáner — desactivado (pesaba mucho) */
  .scan-bg{ display:none; }
  @keyframes scansweep{0%{top:-180px;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:100vh;opacity:0}}
  @media(prefers-reduced-motion:reduce){
    .grid-bg,.scan-bg,body::before{animation:none}
  }
  @keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-20px,18px) scale(1.05)}}
  /* faint star/grid texture */
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.4;
    background-image:radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,.12),transparent),
      radial-gradient(1px 1px at 60% 70%,rgba(255,255,255,.09),transparent),
      radial-gradient(1px 1px at 80% 20%,rgba(255,255,255,.10),transparent),
      radial-gradient(1px 1px at 35% 85%,rgba(255,255,255,.07),transparent),
      radial-gradient(1px 1px at 90% 60%,rgba(255,255,255,.08),transparent);
    background-size:cover;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit}
  a{color:inherit;text-decoration:none}
  .mono{font-family:var(--mono)}
  ::selection{background:rgba(255,107,44,.3)}
  @media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

  /* DEMO BAR */
  .demobar{position:fixed;top:0;left:0;right:0;height:38px;z-index:100;
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:rgba(255,107,44,.10);border-bottom:1px solid rgba(255,107,44,.25);
    font-size:12px;color:var(--fire-soft);letter-spacing:.04em;backdrop-filter:blur(8px)}
  .demobar .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:6px}
  .demobar .seg button{padding:4px 12px;font-size:11px;color:var(--text-dim);background:var(--surface)}
  .demobar .seg button.on{background:var(--fire);color:#0A0A0A;font-weight:600}

  .app{padding-top:0;min-height:100vh;position:relative;z-index:1}

  /* ===== LOGO ORB (animated, like Lucid) ===== */
  .orb-wrap{display:flex;align-items:center;gap:14px}
  .orb{width:46px;height:46px;border-radius:50%;position:relative;flex-shrink:0;
    background:radial-gradient(circle at 35% 30%, #3A4D6B 0%, #18243A 38%, #060A12 78%);
    box-shadow:inset -6px -6px 14px rgba(0,0,0,.7), inset 4px 4px 10px rgba(120,160,220,.18);}
  .orb::before{/* glowing crescent */
    content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 72% 68%, rgba(255,138,76,.0) 0%, rgba(255,107,44,.0) 40%);
    box-shadow:-3px -2px 22px 2px rgba(52,179,255,.55), 2px 3px 18px rgba(255,107,44,.35);
    animation:orbGlow 5s ease-in-out infinite alternate;}
  .orb::after{/* highlight sweep */
    content:"";position:absolute;width:12px;height:12px;border-radius:50%;top:9px;left:11px;
    background:radial-gradient(circle, rgba(180,210,255,.9), transparent 70%);filter:blur(1px)}
  @keyframes orbGlow{0%{box-shadow:-3px -2px 20px 1px rgba(52,179,255,.4), 2px 3px 14px rgba(255,107,44,.25)}
    100%{box-shadow:-4px -2px 28px 3px rgba(52,179,255,.65), 3px 4px 22px rgba(255,107,44,.45)}}
  .brand-txt .brand-name{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.07em;line-height:1}
  .brand-txt .brand-name span{color:var(--fire)}
  .brand-txt .brand-sub{font-size:9.5px;letter-spacing:.36em;color:var(--text-faint);margin-top:4px}
  /* sniper scope reticle (login) */
  .scope{position:relative;width:150px;height:150px;display:grid;place-items:center;margin:0 auto 6px}
  .scope .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,107,44,.22)}
  .scope .ring2{position:absolute;inset:20px;border-radius:50%;border:1px dashed rgba(52,179,255,.28);animation:spin 22s linear infinite}
  .scope .ring3{position:absolute;inset:40px;border-radius:50%;border:1px solid rgba(255,107,44,.14)}
  .scope .cross{position:absolute;background:rgba(255,107,44,.45)}
  .scope .cross.t{top:0;left:50%;width:1.5px;height:18px;transform:translateX(-50%)}
  .scope .cross.b{bottom:0;left:50%;width:1.5px;height:18px;transform:translateX(-50%)}
  .scope .cross.l{left:0;top:50%;height:1.5px;width:18px;transform:translateY(-50%)}
  .scope .cross.r{right:0;top:50%;height:1.5px;width:18px;transform:translateY(-50%)}
  .scope .orb{width:62px;height:62px;z-index:2}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* scan sweep on login card */
  .login-card .scan{position:absolute;left:0;right:0;height:60px;pointer-events:none;z-index:0;
    background:linear-gradient(180deg,transparent,rgba(52,179,255,.06),transparent);animation:sweep 5s ease-in-out infinite}
  @keyframes sweep{0%{top:-60px}100%{top:100%}}

  /* LOGIN */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
  .sniper-bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .candles-svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:52%;opacity:.42}
  @keyframes candleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .emblem-wrap{position:absolute;top:26px;left:26px;width:120px;height:120px;opacity:.5}
  .corner-emblem{width:100%;height:100%}
  @media(max-width:720px){.emblem-wrap{width:78px;height:78px;top:16px;left:16px;opacity:.4}.candles-svg{height:42%;opacity:.3}}
  .login-col{position:relative;z-index:1}
  .login-card{width:100%;max-width:430px;background:linear-gradient(160deg,var(--surface),#0D1420);
    border:1px solid var(--line);border-radius:20px;padding:44px 36px;position:relative;overflow:hidden;
    box-shadow:0 40px 90px -30px rgba(0,0,0,.85);animation:rise .6s cubic-bezier(.2,.8,.2,1)}
  .login-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--fire),var(--cyan),transparent);
    animation:shimmer 4s linear infinite}
  @keyframes shimmer{0%{opacity:.5}50%{opacity:1}100%{opacity:.5}}
  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  .login-orb{display:flex;justify-content:center;margin-bottom:24px}
  .login-orb .orb{width:64px;height:64px}
  .login-h{font-family:var(--display);font-size:23px;font-weight:600;text-align:center;margin-bottom:6px}
  .login-h span{color:var(--fire)}
  .login-p{font-size:13px;color:var(--text-dim);text-align:center;margin-bottom:26px;line-height:1.55}
  .field{margin-bottom:18px}
  .field label{display:block;font-size:11px;letter-spacing:.06em;color:var(--text-dim);text-transform:uppercase;margin-bottom:8px;font-weight:600}
  .field input{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;
    padding:14px 15px;color:var(--text);font-size:14px;transition:.18s}
  .field input:focus{outline:none;border-color:var(--fire);box-shadow:0 0 0 3px rgba(255,107,44,.13)}
  .btn-primary{width:100%;padding:15px;border-radius:12px;font-weight:600;font-size:14px;
    background:linear-gradient(135deg,var(--fire),#E8551C);color:#0A0A0A;letter-spacing:.02em;
    transition:transform .12s,box-shadow .2s,filter .2s;box-shadow:0 10px 30px -10px rgba(255,107,44,.65)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 40px -10px rgba(255,107,44,.8);filter:brightness(1.05)}
  .btn-primary:active{transform:translateY(0)}
  .login-note{margin-top:20px;text-align:center;font-size:12px;color:var(--text-faint);line-height:1.6}
  .login-note a{color:var(--cyan)}
  .login-err{background:rgba(255,77,94,.1);border:1px solid rgba(255,77,94,.3);color:#FF8A95;
    font-size:12.5px;padding:11px 13px;border-radius:10px;margin-bottom:18px;display:none;line-height:1.45}
  .login-err.show{display:block;animation:rise .3s}
  .pass-wrap{position:relative}
  .pass-wrap input{padding-right:46px !important}
  .eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:30px;height:30px;
    display:grid;place-items:center;color:var(--text-faint);cursor:pointer;border-radius:8px;transition:.13s}
  .eye:hover{color:var(--text)}
  .forgot{text-align:right;margin-top:-8px;margin-bottom:16px}
  .forgot a{font-size:12px;color:var(--cyan)}
  .remember-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px 0 16px;flex-wrap:wrap}
  .remember{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);cursor:pointer;user-select:none}
  .remember input{width:16px;height:16px;accent-color:var(--fire);cursor:pointer}
  .remember-row a{font-size:12px;color:var(--cyan)}

  /* SHELL */
  .shell{display:flex;min-height:100vh}
  .side{width:252px;flex-shrink:0;background:linear-gradient(180deg,var(--bg-2),#070B12);
    border-right:1px solid var(--line-soft);padding:24px 16px;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;overflow:hidden}
  /* fondo animado del menú lateral */
  .side::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(300px 200px at 30% 0%, rgba(255,107,44,.10), transparent 65%),
      radial-gradient(320px 240px at 70% 100%, rgba(52,179,255,.09), transparent 65%);
    }
  @keyframes sideglow{
    0%{background-position:0% 0%,100% 100%;opacity:.7}
    100%{background-position:20% 10%,80% 90%;opacity:1}}
  /* rejilla vertical que sube lento */
  .side::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.4;
    background-image:linear-gradient(rgba(52,179,255,.05) 1px,transparent 1px);
    background-size:100% 34px;
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 25%,#000 75%,transparent);
    mask-image:linear-gradient(180deg,transparent,#000 25%,#000 75%,transparent);
    }
  @keyframes sidegrid{from{background-position:0 0}to{background-position:0 -34px}}
  .side>*{position:relative;z-index:1}
  @media(prefers-reduced-motion:reduce){.side::before,.side::after{animation:none}}
  .side .orb-wrap{margin-bottom:32px;padding:0 6px}
  .nav{display:flex;flex-direction:column;gap:3px}
  .nav button{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;
    font-size:14px;color:var(--text-dim);font-weight:500;text-align:left;width:100%;position:relative;
    overflow:hidden;transition:color .18s,background .18s,transform .18s cubic-bezier(.2,.9,.25,1)}
  .nav button:hover{background:var(--surface);color:var(--text);transform:translateX(4px)}
  .nav button.on{background:linear-gradient(135deg,var(--surface-2),#101826);color:var(--text)}
  .nav button.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;
    background:linear-gradient(180deg,var(--fire),var(--fire-soft));box-shadow:0 0 12px var(--fire);
    animation:barpulse 2.4s ease-in-out infinite}
  @keyframes barpulse{0%,100%{box-shadow:0 0 8px var(--fire);opacity:.85}50%{box-shadow:0 0 18px var(--fire);opacity:1}}
  /* destello que cruza el botón al pasar el mouse */
  .nav-badge{margin-left:auto;background:var(--fire);color:#0a0a0a;font-size:11px;font-weight:800;
    min-width:20px;height:20px;padding:0 6px;border-radius:11px;display:inline-flex;align-items:center;
    justify-content:center;box-shadow:0 0 12px rgba(255,107,44,.6);animation:badgePulse 2s ease-in-out infinite}
  @keyframes badgePulse{0%,100%{transform:scale(1);box-shadow:0 0 10px rgba(255,107,44,.5)}50%{transform:scale(1.08);box-shadow:0 0 18px rgba(255,107,44,.8)}}
  .nav button.on .nav-badge{background:#0a0a0a;color:var(--fire-soft);box-shadow:none;animation:none}
  .nav button::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);
    transform:skewX(-18deg);transition:none}
  .nav button:hover::after{animation:navsheen .65s ease}
  @keyframes navsheen{from{left:-60%}to{left:130%}}
  .ic{width:18px;height:18px;flex-shrink:0;color:var(--text-faint);
    transition:color .18s,transform .28s cubic-bezier(.2,.9,.25,1),filter .18s}
  .nav button.on .ic,.nav button:hover .ic{color:var(--fire-soft)}
  .nav button:hover .ic{transform:scale(1.18) rotate(-6deg);filter:drop-shadow(0 0 6px rgba(255,107,44,.55))}
  .nav button.on .ic{filter:drop-shadow(0 0 5px rgba(255,107,44,.45));animation:icfloat 3s ease-in-out infinite}
  @keyframes icfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  @media(prefers-reduced-motion:reduce){
    .nav button,.nav button .ic,.nav button.on::before{animation:none!important;transition:none}
    .nav button:hover{transform:none}
  }
  .side-foot{margin-top:auto;padding-top:18px;border-top:1px solid var(--line-soft)}
  .side-user{display:flex;align-items:center;gap:11px;padding:8px;border-radius:11px}
  .avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#1B2940,#0C1320);
    border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;
    font-family:var(--display);color:var(--fire-soft);flex-shrink:0}
  .side-user .meta{min-width:0}
  .side-user .meta .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-user .meta .e{font-size:11px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .logout{margin-top:10px;width:100%;display:flex;align-items:center;gap:10px;padding:10px 13px;
    border-radius:11px;font-size:13px;color:var(--text-dim);transition:.15s}
  .logout:hover{background:rgba(255,77,94,.08);color:#FF8A95}

  .main{flex:1;padding:34px 40px 60px;min-width:0;animation:fadein .45s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .page-head{margin-bottom:26px}
  .page-head h1{font-family:var(--display);font-size:28px;font-weight:600;letter-spacing:-.01em}
  .page-head p{color:var(--text-dim);font-size:14px;margin-top:5px}

  /* PRODUCT CARDS */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
  .card{background:linear-gradient(165deg,var(--surface),#0D1420);border:1px solid var(--line-soft);
    border-radius:18px;overflow:hidden;transition:border-color .2s,transform .2s,box-shadow .25s;
    display:flex;flex-direction:column;position:relative;animation:rise .5s ease backwards}
  .card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.18s}
  .card:hover{border-color:rgba(255,107,44,.35);transform:translateY(-4px);
    box-shadow:0 24px 50px -24px rgba(255,107,44,.25),0 0 0 1px rgba(255,107,44,.12)}
  .card-top{padding:20px 20px 16px;border-bottom:1px solid var(--line-soft)}
  .card-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .card-name{font-family:var(--display);font-size:17px;font-weight:600;line-height:1.25}
  .card-cat{font-size:11px;color:var(--text-faint);letter-spacing:.05em;margin-top:4px;text-transform:uppercase}
  .pill{font-size:10px;font-weight:600;letter-spacing:.05em;padding:5px 10px;border-radius:20px;text-transform:uppercase;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:6px}
  .pill .pdot{width:6px;height:6px;border-radius:50%}
  .pill.active{background:rgba(39,215,150,.12);color:var(--green);border:1px solid rgba(39,215,150,.28)}
  .pill.active .pdot{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite}
  .pill.pending{background:rgba(255,194,71,.12);color:var(--amber);border:1px solid rgba(255,194,71,.28)}
  .pill.pending .pdot{background:var(--amber)}
  .pill.locked{background:rgba(138,152,172,.1);color:var(--text-dim);border:1px solid var(--line)}
  .pill.locked .pdot{background:var(--text-faint)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .card-desc{font-size:13px;color:var(--text-dim);line-height:1.55;padding:14px 20px 0}
  /* progress bar (Lucid style) */
  .prog-wrap{padding:16px 20px 4px}
  .prog-top{display:flex;justify-content:space-between;font-size:11px;color:var(--text-faint);margin-bottom:7px;letter-spacing:.03em}
  .prog-top b{color:var(--text);font-family:var(--mono);font-weight:500}
  .prog-bar{height:6px;border-radius:6px;background:var(--bg-2);overflow:hidden;position:relative}
  .prog-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--fire),var(--fire-soft));
    box-shadow:0 0 12px rgba(255,107,44,.5);transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) backwards}
  .prog-fill.cyan{background:linear-gradient(90deg,var(--cyan),var(--cyan-soft));box-shadow:0 0 12px rgba(52,179,255,.5)}
  .prog-fill.green{background:linear-gradient(90deg,var(--green),#5DEBB4);box-shadow:0 0 12px rgba(39,215,150,.5)}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .card-meta{padding:12px 20px;display:flex;gap:20px;flex-wrap:wrap}
  .meta-item{font-size:11px;color:var(--text-faint)}
  .meta-item b{display:block;font-family:var(--mono);font-size:12.5px;color:var(--text);margin-top:3px;font-weight:500}
  .card-actions{margin-top:auto;padding:16px 20px;display:flex;gap:10px;border-top:1px solid var(--line-soft)}
  .btn-dl{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:11px;
    font-size:13px;font-weight:600;background:linear-gradient(135deg,var(--fire),#E8551C);color:#0A0A0A;transition:.15s}
  .btn-dl:hover{filter:brightness(1.08);box-shadow:0 8px 22px -8px rgba(255,107,44,.6)}
  .btn-dl.disabled{background:var(--surface-2);color:var(--text-faint);border:1px solid var(--line);cursor:not-allowed;box-shadow:none}
  .btn-vid{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:11px;
    font-size:13px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--text);transition:.15s}
  .btn-vid:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 8px 22px -10px rgba(52,179,255,.5)}

  /* NEWS */
  .news-list{display:flex;flex-direction:column;gap:14px;max-width:740px}
  .news-item{background:linear-gradient(160deg,var(--surface),#0D1420);border:1px solid var(--line-soft);
    border-radius:15px;padding:20px 22px 20px 26px;position:relative;transition:.2s;animation:rise .5s ease backwards}
  .news-item:nth-child(2){animation-delay:.07s}.news-item:nth-child(3){animation-delay:.14s}
  .news-item:hover{border-color:var(--line);transform:translateX(3px)}
  .news-item::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:3px;
    background:var(--fire);box-shadow:0 0 12px var(--fire)}
  .news-item.cyan::before{background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
  .news-item.green::before{background:var(--green);box-shadow:0 0 12px var(--green)}
  .news-date{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-bottom:8px;letter-spacing:.03em}
  .news-item h3{font-family:var(--display);font-size:16px;font-weight:600;margin-bottom:7px}
  .news-item p{font-size:13.5px;color:var(--text-dim);line-height:1.6}
  .news-tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    padding:3px 9px;border-radius:6px;margin-bottom:10px;background:rgba(255,107,44,.12);color:var(--fire-soft)}
  .news-tag.cyan{background:rgba(52,179,255,.12);color:var(--cyan)}
  .news-tag.green{background:rgba(39,215,150,.12);color:var(--green)}

  /* CONTACT */
  .contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:780px}
  .contact-card{background:linear-gradient(160deg,var(--surface),#0D1420);border:1px solid var(--line-soft);
    border-radius:15px;padding:24px;display:flex;flex-direction:column;gap:6px;transition:.2s;animation:rise .5s ease backwards}
  .contact-card:nth-child(2){animation-delay:.08s}.contact-card:nth-child(3){animation-delay:.16s}
  .contact-card:hover{border-color:var(--line);transform:translateY(-3px)}
  .contact-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:8px;
    background:var(--surface-2);border:1px solid var(--line)}
  .contact-card .lbl{font-size:11px;color:var(--text-faint);letter-spacing:.05em;text-transform:uppercase}
  .contact-card .val{font-family:var(--display);font-size:18px;font-weight:600}
  .contact-card .sub{font-size:12px;color:var(--text-dim)}

  /* ADMIN */
  .admin-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:14px;flex-wrap:wrap}
  .search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);
    border-radius:11px;padding:10px 13px;flex:1;max-width:330px}
  .search input{background:none;border:none;outline:none;color:var(--text);font-size:13px;width:100%}
  .search input::placeholder{color:var(--text-faint)}
  .btn-ghost{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:11px;
    background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--text);transition:.15s}
  .btn-ghost:hover{border-color:var(--fire);color:var(--fire-soft)}
  .btn-add{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:11px;
    background:linear-gradient(135deg,var(--fire),#E8551C);color:#0A0A0A;font-size:13px;font-weight:600;transition:.15s}
  .btn-add:hover{filter:brightness(1.08);box-shadow:0 8px 22px -8px rgba(255,107,44,.6)}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:26px}
  .stat{background:linear-gradient(160deg,var(--surface),#0D1420);border:1px solid var(--line-soft);
    border-radius:15px;padding:20px;position:relative;overflow:hidden;animation:rise .5s ease backwards}
  .stat:nth-child(2){animation-delay:.06s}.stat:nth-child(3){animation-delay:.12s}.stat:nth-child(4){animation-delay:.18s}
  .stat::after{content:"";position:absolute;top:-30px;right:-30px;width:80px;height:80px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,107,44,.10),transparent 70%)}
  .stat .v{font-family:var(--display);font-size:30px;font-weight:600;line-height:1}
  .statbtn{cursor:pointer;text-align:left;font-family:inherit;transition:.15s}
  .statbtn:hover{border-color:var(--amber,#F5A623);transform:translateY(-2px)}
  .statbtn.on{border-color:var(--amber,#F5A623);box-shadow:0 0 0 1px var(--amber,#F5A623) inset}
  .stat .l{font-size:12px;color:var(--text-dim);margin-top:8px}
  .stat .v.fire{color:var(--fire-soft)}.stat .v.green{color:var(--green)}.stat .v.amber{color:var(--amber)}.stat .v.cyan{color:var(--cyan)}
  .table{background:linear-gradient(160deg,var(--surface),#0D1420);border:1px solid var(--line-soft);border-radius:15px;overflow:hidden}
  .trow{display:grid;grid-template-columns:1.6fr 1.4fr 1fr 0.9fr auto;gap:14px;align-items:center;
    padding:15px 22px;border-bottom:1px solid var(--line-soft);font-size:13.5px}
  .trow:last-child{border-bottom:none}
  .trow.head{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);font-weight:600;background:var(--bg-2)}
  .trow:not(.head):hover{background:var(--surface-2)}
  .cust-name{display:flex;align-items:center;gap:11px;min-width:0}
  .cust-name .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cust-email{font-family:var(--mono);font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .email-movil{display:none;font-family:var(--mono);font-size:11px;color:var(--text-faint);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px}
  .dot.g{background:var(--green);box-shadow:0 0 8px var(--green)}
  .dot.a{background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .dot.r{background:var(--red)}
  .row-act{display:flex;gap:7px;justify-content:flex-end}
  .ibtn{width:32px;height:32px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);
    display:grid;place-items:center;color:var(--text-dim);transition:.13s}
  .ibtn:hover{border-color:var(--fire);color:var(--fire-soft)}
  .ibtn.danger:hover{border-color:var(--red);color:var(--red)}

  /* MODAL */
  .modal-bg{position:fixed;inset:0;background:rgba(4,7,12,.8);backdrop-filter:blur(5px);z-index:200;
    display:none;align-items:center;justify-content:center;padding:24px}
  .modal-bg.show{display:flex;animation:fadein .2s}
  .modal{background:linear-gradient(165deg,var(--surface),#0D1420);border:1px solid var(--line);border-radius:18px;
    width:100%;max-width:560px;max-height:calc(100vh - 48px);display:flex;flex-direction:column;
    overflow:hidden;box-shadow:0 50px 110px -30px rgba(0,0,0,.9);animation:rise .3s}
  .modal-head{padding:20px 24px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
  .modal-head h3{font-family:var(--display);font-size:17px;font-weight:600}
  .modal-x{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--text-dim);transition:.13s}
  .modal-x:hover{background:var(--surface-2);color:var(--text)}
  .modal-body{padding:24px;overflow-y:auto;flex:1;min-height:0}
  .video-frame{aspect-ratio:16/9;background:radial-gradient(circle at 50% 40%,#0E1726,#000);border-radius:13px;
    border:1px solid var(--line);display:grid;place-items:center;position:relative;overflow:hidden}
  .video-frame .play{width:66px;height:66px;border-radius:50%;background:rgba(255,107,44,.95);display:grid;place-items:center;
    box-shadow:0 0 50px rgba(255,107,44,.55);transition:.2s;cursor:pointer}
  .video-frame .play:hover{transform:scale(1.08)}
  .video-frame .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--text-dim)}
  .modal-steps{margin-top:20px;display:flex;flex-direction:column;gap:11px}
  .mstep{display:flex;gap:13px;align-items:flex-start}
  .mstep .num{width:24px;height:24px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);
    display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--fire-soft);flex-shrink:0;font-weight:700}
  .mstep p{font-size:13.5px;color:var(--text-dim);line-height:1.5;padding-top:2px}
  .mfield{margin-bottom:16px}
  .mfield label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-dim);font-weight:600;margin-bottom:7px}
  .mfield input,.mfield textarea,.mfield select{width:100%;background:var(--bg-2);border:1px solid var(--line);
    border-radius:11px;padding:12px 13px;color:var(--text);font-size:13.5px;font-family:var(--body)}
  .mfield input:focus,.mfield textarea:focus,.mfield select:focus{outline:none;border-color:var(--fire)}
  .mfield textarea{resize:vertical;min-height:80px}
  .modal-foot{padding:18px 24px;border-top:1px solid var(--line-soft);display:flex;justify-content:flex-end;gap:10px;flex-shrink:0}

  @media(max-width:860px){
    .side{position:fixed;left:-262px;transition:left .2s;z-index:60;box-shadow:20px 0 60px rgba(0,0,0,.6)}
    .side.open{left:0}
    .main{padding:24px 18px 50px}
    .trow{grid-template-columns:1.4fr auto;gap:10px}
    .trow .col-hide{display:none}
    .email-movil{display:block}
    .menu-btn{display:grid !important}
  }
  .top-hi{display:flex;justify-content:flex-start;margin:0 0 10px;animation:hiFade .5s ease}
  .top-hi-txt{font-size:13.5px;color:var(--text-dim);background:rgba(255,107,44,.07);border:1px solid rgba(255,107,44,.15);padding:7px 15px;border-radius:20px}
  .top-hi-txt b{color:var(--fire)}
  @keyframes hiFade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
  @media(max-width:820px){.top-hi{margin-top:8px}}
  .menu-btn{display:none;position:fixed;top:14px;left:14px;z-index:55;width:42px;height:42px;
    border-radius:12px;background:var(--surface);border:1px solid var(--line);place-items:center;color:var(--text)}
  .info-btn{position:fixed;top:16px;right:18px;z-index:56;width:42px;height:42px;border-radius:12px;
    background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--text-dim);
    transition:.15s;box-shadow:0 6px 18px -8px rgba(0,0,0,.5)}
  .info-btn:hover{border-color:var(--fire);color:var(--fire-soft)}
  .info-sec{margin-bottom:20px}
  .info-sec h4{font-family:var(--display);font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--fire-soft);margin-bottom:8px}
  .info-sec p{font-size:13.5px;color:var(--text-dim);line-height:1.6}
  .info-plat{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .info-chip{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 11px;color:var(--text)}
  .info-contact{display:flex;flex-direction:column;gap:9px;margin-top:4px}
  .info-contact a{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--text);padding:9px 12px;
    background:var(--bg-2);border:1px solid var(--line-soft);border-radius:10px;transition:.13s}
  .info-contact a:hover{border-color:var(--line)}
  /* empty states (admin sections to fill later) */
  .empty-state{text-align:center;padding:70px 24px;max-width:460px;margin:0 auto}
  .empty-ic{width:66px;height:66px;border-radius:18px;margin:0 auto 18px;display:grid;place-items:center;
    background:var(--surface);border:1px solid var(--line);color:var(--fire-soft)}
  .empty-state h3{font-family:var(--display);font-size:18px;margin-bottom:8px;color:var(--text)}
  .empty-state p{color:var(--text-dim);font-size:14px;line-height:1.5}
  /* disclaimer footer */
  .disclaimer{margin:46px auto 0;padding:22px 4px 0;border-top:1px solid var(--line-soft);max-width:880px}
  .disclaimer p{font-size:11.5px;color:var(--text-faint);line-height:1.65}
  .disclaimer .copy{margin-top:10px;opacity:.75}
  .login-col{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:430px}
  .login-col .disclaimer{margin:6px 0 0;border:none;padding:0 14px;text-align:center}
  .login-col .disclaimer p{font-size:10.5px}
  /* FAQ accordion */
  .faq-list{display:flex;flex-direction:column;gap:10px;max-width:720px}
  .faq-item{background:var(--surface);border:1px solid var(--line-soft);border-radius:13px;overflow:hidden;cursor:pointer;transition:border-color .15s}
  .faq-item:hover{border-color:var(--line)}
  .faq-q{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;font-weight:600;font-size:14.5px}
  .faq-arrow{color:var(--fire-soft);transition:transform .2s;flex-shrink:0}
  .faq-item.open .faq-arrow{transform:rotate(180deg)}
  .faq-a{max-height:0;overflow:hidden;padding:0 18px;color:var(--text-dim);font-size:13.5px;line-height:1.6;transition:max-height .25s,padding .25s}
  .faq-item.open .faq-a{max-height:240px;padding:0 18px 16px}
  /* segmented buttons (product access type) */
  .seg-btn{flex:1;padding:11px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line);
    color:var(--text-dim);font-size:13px;font-weight:600;transition:.15s;cursor:pointer}
  .seg-btn.on{background:rgba(255,107,44,.12);border-color:var(--fire);color:var(--fire-soft)}
  /* access checkboxes */
  .acc-row{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line-soft);
    border-radius:10px;cursor:pointer;font-size:13.5px;transition:.13s}
  .acc-row:hover{border-color:var(--line);background:var(--surface-2)}
  .acc-row input{width:18px;height:18px;accent-color:var(--fire);cursor:pointer}
  /* PC picker */
  .pcs-pick{display:flex;gap:8px}
  .pcs-opt{flex:1;padding:13px 0;border-radius:11px;background:var(--bg-2);border:1px solid var(--line);
    color:var(--text);font-weight:700;font-family:var(--display);font-size:16px;cursor:pointer;transition:.13s}
  .pcs-opt:hover{border-color:var(--fire)}
  .pcs-opt.on{background:rgba(255,107,44,.14);border-color:var(--fire);color:var(--fire-soft)}
  /* language toggle */
  .lang-toggle{display:flex;gap:0;align-self:center;margin-bottom:18px;background:var(--surface);
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .lang-toggle button{padding:7px 16px;background:transparent;border:none;color:var(--text-dim);
    font-size:12.5px;font-weight:700;font-family:var(--display);letter-spacing:.04em;cursor:pointer;transition:.13s}
  .lang-toggle button.on{background:var(--fire);color:#0a0a0a}
  /* product view toggle */
  .view-toggle{display:flex;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;height:fit-content}
  .view-toggle button{padding:8px 12px;background:transparent;border:none;color:var(--text-dim);cursor:pointer;display:grid;place-items:center;transition:.13s}
  .view-toggle button.on{background:var(--fire);color:#0a0a0a}
  /* discounts */
  .disc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .disc-card{background:linear-gradient(160deg,var(--surface),#0D1420);border:1px solid var(--line);
    border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;transition:.15s}
  .disc-card:hover{border-color:var(--fire);transform:translateY(-2px)}
  /* ── MI BALANCE ─────────────────────────────────────────── */
  .bal-tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:18px}
  .bal-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 17px}
  .bal-card .l{font-size:12px;color:var(--text-faint);margin-bottom:6px}
  .bal-card .v{font-size:24px;font-weight:600;font-family:var(--display);color:var(--text)}
  .bal-card.verde{border-left:3px solid var(--green)}
  .bal-card.rojo{border-left:3px solid var(--red)}
  .bal-acc{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .bal-lista{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .bal-cab{padding:12px 16px;border-bottom:1px solid var(--line-soft);font-size:12px;color:var(--text-faint)}
  .bal-mov{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
  .bal-mov:last-child{border-bottom:none}
  .bal-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .bal-ic.ent{background:rgba(29,158,117,.15);color:var(--green)}
  .bal-ic.sal{background:rgba(255,107,44,.15);color:var(--fire-soft)}
  .bal-inf{flex:1;min-width:0}
  .bal-inf b{display:block;font-size:13.5px;color:var(--text);font-weight:500}
  .bal-inf span{font-size:11.5px;color:var(--text-faint)}
  .bal-num{font-size:14.5px;font-weight:600;white-space:nowrap;font-family:var(--mono)}
  .bal-num.ent{color:var(--green)}
  .bal-num.sal{color:var(--fire-soft)}
  .bal-del{background:none;border:none;color:var(--text-faint);cursor:pointer;padding:5px;
    border-radius:7px;flex-shrink:0;opacity:0;transition:.14s}
  .bal-mov:hover .bal-del{opacity:1}
  .bal-del:hover{color:var(--red);background:rgba(255,77,94,.1)}
  .bal-vacio{text-align:center;padding:36px 20px;color:var(--text-dim);font-size:13.5px;line-height:1.7}
  .bal-fase{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.04em;
    padding:2px 7px;border-radius:6px;margin-left:7px;vertical-align:1px;font-family:var(--body)}
  .f-FASE1{background:rgba(52,179,255,.16);color:var(--cyan-soft)}
  .f-FASE2{background:rgba(255,176,32,.16);color:#FFC65C}
  .f-PRO{background:rgba(29,158,117,.18);color:#5DCAA5}
  .f-CONSISTENCIA{background:rgba(127,119,221,.18);color:#AFA9EC}

  .bal-selbar{display:flex;align-items:center;gap:10px;padding:11px 16px;

  .bal-selbar b{font-size:13px;color:var(--text)}
  .bal-selbar button{font-size:12.5px;padding:6px 12px}
  .bal-priv{margin-top:14px;padding:12px 15px;background:var(--bg-2);border-radius:10px;
    display:flex;gap:10px;align-items:flex-start}
  .bal-priv span{font-size:12px;color:var(--text-faint);line-height:1.55}
  .bal-cerrado{background:var(--surface);border:1px solid var(--line);border-radius:14px;

  .bal-cerrado h3{margin:14px 0 8px;font-family:var(--display);font-size:18px;color:var(--text)}

  /* ── MIS CUENTAS por fases ─────────────────────────────── */
  .cta-fase{margin-bottom:20px}
  .cta-fh{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
  .cta-fh h3{margin:0;font-family:var(--display);font-size:15px;font-weight:600;color:var(--text)}
  .cta-pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px}
  .cta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px}
  .cta{background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;transition:.14s;position:relative}
  .cta:hover{border-color:var(--line-soft);transform:translateY(-1px)}
  .cta.sel{border-color:var(--fire) !important;background:rgba(255,107,44,.16);
    box-shadow:0 0 0 2px rgba(255,107,44,.45)}

  .cta.sel .cta-eur{color:var(--fire-soft)}
  .cta-num{font-size:11px;font-family:var(--mono);color:var(--cyan);
    background:rgba(52,179,255,.12);padding:1px 6px;border-radius:5px;margin-left:5px}
  .cta-arch{opacity:.55}
  .cta-arch .cta-nom b{text-decoration:line-through}
  .arch-caja{background:var(--surface);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;margin-top:22px}
  .arch-cab{padding:13px 16px;border-bottom:1px solid var(--line-soft);
    display:flex;align-items:center;gap:10px;cursor:pointer}
  .arch-cab b{font-size:14px;color:var(--text-dim);font-weight:500}
  .arch-fila{display:flex;align-items:center;gap:11px;padding:10px 16px;
    border-bottom:1px solid var(--line-soft);font-size:13px}
  .arch-fila:last-child{border-bottom:none}
  .cta-top{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px}
  .cta-nom{flex:1;min-width:0}
  .cta-nom b{display:block;font-size:13.5px;color:var(--text);font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cta-nom span{font-size:11px;color:var(--text-faint)}
  .cta-eur{font-size:12px;color:var(--text-dim);font-family:var(--mono);white-space:nowrap}
  .cta-pnl{font-size:12.5px;font-family:var(--mono);margin:7px 0;padding:6px 9px;
    background:var(--bg-2);border-radius:7px;display:flex;justify-content:space-between}
  .cta-ret{font-size:11.5px;color:var(--green);font-family:var(--mono);margin-top:4px}
  .cta-rets{margin:7px 0 2px;border-top:1px solid var(--line-soft);padding-top:6px}
  .cta-rl{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:3px 0}
  .cta-rl span:first-child{color:var(--text-faint);min-width:22px}
  .cta-rl b{color:var(--green);font-family:var(--mono);margin-left:auto}
  .cta-rx{background:none;border:none;color:var(--text-faint);cursor:pointer;
    padding:2px 3px;border-radius:4px;line-height:0}
  .cta-rx:hover{color:var(--red);background:rgba(255,77,94,.1)}
  .cta-lap{background:none;border:none;color:var(--text-faint);cursor:pointer;padding:3px;
    border-radius:6px;flex-shrink:0;opacity:0;transition:.14s}
  .cta:hover .cta-lap{opacity:1}
  .cta-lap:hover{color:var(--cyan);background:rgba(52,179,255,.12)}
  .cta-atras{background:none;border:none;color:var(--text-faint);cursor:pointer;
    font-size:11px;padding:4px 7px;border-radius:6px;font-family:var(--body)}
  .cta-atras:hover{color:var(--text-dim);background:var(--bg-2)}
  .cta-btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .cta-b{flex:1;min-width:0;background:var(--bg-2);border:1px solid var(--line-soft);
    color:var(--text-dim);border-radius:8px;padding:7px 6px;font-size:11.5px;
    cursor:pointer;font-family:var(--body);white-space:nowrap;transition:.13s}
  .cta-b:hover{border-color:var(--fire);color:var(--text)}
  .cta-b.go{background:rgba(255,107,44,.12);border-color:rgba(255,107,44,.35);color:var(--fire-soft)}
  .cta-b.ret{background:rgba(29,158,117,.12);border-color:rgba(29,158,117,.35);color:var(--green)}
  .cta-x{background:none;border:none;color:var(--text-faint);cursor:pointer;padding:3px;
    border-radius:6px;flex-shrink:0;opacity:0;transition:.14s}
  .cta:hover .cta-x{opacity:1}
  .cta-x:hover{color:var(--red);background:rgba(255,77,94,.1)}
  /* Casilla propia: la del navegador sale blanca sobre fondo oscuro
     y no se distingue si esta marcada o no. */
  .cta-chk{appearance:none;-webkit-appearance:none;width:19px;height:19px;flex-shrink:0;
    border:2px solid var(--line);border-radius:5px;background:var(--bg-2);
    cursor:pointer;position:relative;transition:.13s;margin:0}
  .cta-chk:hover{border-color:var(--fire)}
  .cta-chk:checked{background:var(--fire);border-color:var(--fire)}
  .cta-chk:checked::after{content:'';position:absolute;left:5px;top:1px;
    width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;
    transform:rotate(45deg)}
  .bal-chk{appearance:none;-webkit-appearance:none;width:19px;height:19px;flex-shrink:0;
    border:2px solid var(--line);border-radius:5px;background:var(--bg-2);
    cursor:pointer;position:relative;transition:.13s;margin:0}
  .bal-chk:hover{border-color:var(--fire)}
  .bal-chk:checked{background:var(--fire);border-color:var(--fire)}
  .bal-chk:checked::after{content:'';position:absolute;left:5px;top:1px;
    width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;
    transform:rotate(45deg)}

  /* fases y seleccion multiple en Mi Balance */
  .bal-fase{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.04em;
    padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:1px}
  .f-FASE1{background:rgba(52,179,255,.16);color:var(--cyan)}
  .f-FASE2{background:rgba(160,120,255,.16);color:#B49CFF}
  .f-PRO{background:rgba(29,158,117,.18);color:var(--green)}
  .f-CONSISTENCIA{background:rgba(255,176,32,.16);color:#FFB020}
  .bal-selbar{display:flex;align-items:center;gap:10px;padding:11px 16px;
    background:rgba(255,107,44,.09);border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
  .bal-selbar b{font-size:13px;color:var(--text)}
  .bal-rapid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
    gap:8px;margin-bottom:16px}
  .bal-rb{background:var(--surface);border:1px solid var(--line);border-radius:11px;
    padding:12px 10px;cursor:pointer;text-align:center;transition:.14s;font-family:var(--body)}
  .bal-rb:hover{border-color:var(--fire);transform:translateY(-1px)}
  .bal-rb b{display:block;font-size:13px;color:var(--text);font-weight:500;margin-top:5px}
  .bal-rb span{font-size:10.5px;color:var(--text-faint)}

  /* valoracion de las prop firms */
  .val-row{display:flex;align-items:center;gap:9px;margin:11px 0 3px;flex-wrap:wrap}
  .val-stars{display:flex;gap:2px}
  .val-st{background:none;border:none;padding:0;cursor:default;line-height:1;
    color:var(--line);transition:.12s;font-size:0}
  .val-st svg{width:17px;height:17px;display:block}
  .val-st.on{color:#FFB020}
  .val-puedo .val-st{cursor:pointer}
  .val-puedo .val-st:hover{transform:scale(1.18)}
  .val-txt{font-size:11.5px;color:var(--text-faint);white-space:nowrap}
  .val-mio{font-size:11px;color:var(--fire-soft);white-space:nowrap}
  .disc-top{display:flex;align-items:center;gap:12px}
  .disc-logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--fire),#E8541A);
    display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;color:#0a0a0a;flex-shrink:0}
  .disc-empresa{font-family:var(--display);font-size:16px;font-weight:600;color:var(--text)}
  .disc-nota{font-size:11.5px;color:var(--text-faint);margin-top:2px;line-height:1.35}
  .disc-off{font-family:var(--display);font-size:20px;font-weight:800;color:var(--green);flex-shrink:0}
  .disc-code-row{display:flex;align-items:center;gap:8px;background:var(--bg-2);border:1px dashed var(--line-strong);
    border-radius:10px;padding:10px 12px}
  .disc-code{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--fire-soft);letter-spacing:.05em;flex:1}
  .disc-copy{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--line);
    color:var(--text);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;transition:.13s}
  .disc-copy:hover{border-color:var(--fire);color:var(--fire-soft)}
  .disc-go{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--fire);color:#0a0a0a;
    border-radius:10px;padding:11px;font-size:13.5px;font-weight:700;text-decoration:none;transition:.13s}
  .disc-go:hover{background:var(--fire-soft)}
  /* layout 2 columnas equilibrado */
  .two-col{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:20px;align-items:start;max-width:1000px}
  .col-stack{display:flex;flex-direction:column;gap:18px}
  .contact-side{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start}
  .contact-side .contact-card:last-child{grid-column:1 / -1}
  @media(max-width:900px){.two-col{grid-template-columns:1fr}.contact-side{grid-template-columns:1fr}}

  /* ── CENTRO DE AYUDA (boton flotante) ────────────────────── */
  .ay-btn{position:fixed;right:22px;bottom:22px;width:56px;height:56px;border-radius:18px;
    background:var(--fire);border:none;cursor:pointer;z-index:900;color:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 26px rgba(255,107,44,.38);transition:.18s}
  .ay-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(255,107,44,.5)}
  .ay-btn svg{width:26px;height:26px}
  .ay-panel{position:fixed;right:22px;bottom:90px;width:380px;max-width:calc(100vw - 32px);
    max-height:min(620px,calc(100vh - 130px));background:var(--surface);border:1px solid var(--line);
    border-radius:18px;z-index:901;display:none;flex-direction:column;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.55)}
  .ay-panel.on{display:flex}
  .ay-head{background:var(--fire);padding:18px 20px;color:#fff}
  .ay-head h3{margin:0;font-family:var(--display);font-size:17px;font-weight:600}
  .ay-head p{margin:4px 0 0;font-size:12.5px;opacity:.92}
  .ay-search{padding:14px 16px;border-bottom:1px solid var(--line-soft)}
  .ay-search input{width:100%;background:var(--bg-2);border:1px solid var(--line);
    border-radius:11px;padding:11px 13px;color:var(--text);font-family:var(--body);font-size:14px}
  .ay-search input:focus{outline:none;border-color:var(--fire)}
  .ay-body{overflow-y:auto;padding:8px 12px 14px;flex:1}
  .ay-cat{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);
    margin:14px 6px 7px;font-weight:600}
  .ay-item{background:var(--bg-2);border:1px solid var(--line-soft);border-radius:11px;
    margin-bottom:7px;overflow:hidden;transition:.14s}
  .ay-item:hover{border-color:var(--line)}
  .ay-q{padding:12px 14px;cursor:pointer;font-size:13.5px;color:var(--text);
    display:flex;justify-content:space-between;gap:10px;align-items:flex-start;line-height:1.45}
  .ay-q span:last-child{color:var(--text-faint);flex-shrink:0;transition:.18s}
  .ay-item.open .ay-q span:last-child{transform:rotate(180deg)}
  .ay-a{display:none;padding:0 14px 13px;font-size:13px;line-height:1.62;color:var(--text-dim);
    border-top:1px solid var(--line-soft);margin-top:0;padding-top:11px}
  .ay-item.open .ay-a{display:block}
  .ay-nada{text-align:center;padding:26px 18px;color:var(--text-dim);font-size:13.5px;line-height:1.6}
  /* conversacion */
  .ay-msg{max-width:86%;padding:11px 14px;border-radius:14px;font-size:13.3px;line-height:1.6;
    margin-bottom:9px;animation:ayIn .22s ease}
  @keyframes ayIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .ay-yo{background:var(--fire);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
  .ay-bot{background:var(--bg-2);border:1px solid var(--line-soft);color:var(--text-dim);
    border-bottom-left-radius:5px}
  .ay-bot b{color:var(--text)}
  .ay-sug{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
  .ay-sug button{background:var(--bg-2);border:1px solid var(--line);color:var(--text-dim);
    border-radius:9px;padding:8px 11px;font-size:12.3px;cursor:pointer;
    font-family:var(--body);text-align:left;line-height:1.4;transition:.14s}
  .ay-sug button:hover{border-color:var(--fire);color:var(--text)}
  .ay-esc{display:flex;gap:5px;padding:11px 14px;background:var(--bg-2);
    border:1px solid var(--line-soft);border-radius:14px;width:fit-content;margin-bottom:9px}
  .ay-esc i{width:6px;height:6px;border-radius:50%;background:var(--text-faint);
    animation:ayPunto 1.3s infinite}
  .ay-esc i:nth-child(2){animation-delay:.18s}
  .ay-esc i:nth-child(3){animation-delay:.36s}
  @keyframes ayPunto{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  .ay-foot{padding:12px 16px;border-top:1px solid var(--line-soft);background:var(--bg-2)}
  .ay-wa{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    background:#25D366;color:#fff;border:none;border-radius:11px;padding:11px;
    font-family:var(--body);font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none}
  @media(max-width:520px){
    .ay-panel{right:12px;left:12px;width:auto;bottom:84px}
    .ay-btn{right:16px;bottom:16px}
  }
  /* Rejilla ancha SOLO para Mi Perfil de admin: mosaico de 3 columnas.
     No toca .two-col, que la usan el perfil de cliente y la pagina de contacto. */
  .perfil-wide{columns:3 360px;column-gap:20px;max-width:1500px}
  .perfil-wide>.card{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;
                     display:inline-block;width:100%;margin:0 0 18px}
  @media(max-width:1200px){.perfil-wide{columns:2 340px}}
  @media(max-width:820px){.perfil-wide{columns:1}}
  .ref-share{display:flex;gap:8px;margin-top:12px}

  .ref-sh.wa{background:rgba(37,211,102,.12);color:#25D366;border:1px solid rgba(37,211,102,.3)}
  .ref-sh.wa:hover{background:rgba(37,211,102,.2)}
  .ref-sh.tg{background:rgba(52,179,255,.12);color:var(--cyan);border:1px solid rgba(52,179,255,.3)}

  .hq{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);

  .hq:hover{border-color:var(--fire);transform:translateY(-2px)}

  .hq b{font-size:13.5px;color:var(--text);font-weight:600}

  .faq-cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .faq-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);

    font-family:var(--body);transition:.13s}

  .faq-count{background:rgba(255,255,255,.1);border-radius:9px;padding:1px 6px;font-size:10.5px}

  .faq-sec{font-family:var(--display);font-size:12px;font-weight:700;color:var(--fire-soft);text-transform:uppercase;

  .help-cta{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;

  .sec-h{font-family:var(--display);font-size:15px;font-weight:600;color:var(--text);margin:0 0 14px;

  .sec-h span{font-size:11.5px;color:var(--text-faint);font-weight:400}

  .rev-date{font-size:11px;color:var(--text-faint);margin-top:1px}

  .rev-form-t{font-family:var(--display);font-size:14.5px;font-weight:600;margin-bottom:12px}
  .rev-pick{display:flex;align-items:center;gap:3px;margin-bottom:12px}

  .cal-imp.low{background:#6b7280}
  .cal-imp.hol{background:#8b5cf6}
  .cal-main{flex:1;min-width:0;font-size:12.5px;color:var(--text);line-height:1.35}
  .cal-flag{margin-right:3px}
  .cal-meta{font-size:10.5px;color:var(--text-faint);margin-top:2px}
  /* product detail page */
  .prod-click{cursor:pointer;transition:transform .16s,border-color .16s,box-shadow .16s}
  .prod-click:hover{transform:translateY(-2px)}
  .card.prod-click:hover{border-color:var(--fire);box-shadow:0 12px 30px -14px rgba(255,107,44,.5)}
  /* efecto de luz recorriendo el borde de las tarjetas de producto */
  .card.prod-click{position:relative}
  .card.prod-click::before{
    content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;
    background:conic-gradient(from var(--ang,0deg),transparent 0deg,transparent 70deg,var(--fire) 110deg,#ff9a5c 140deg,transparent 180deg,transparent 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    opacity:0;transition:opacity .3s;pointer-events:none;z-index:2;
  }
  .card.prod-click:hover::before{opacity:1;animation:bordeGira 2.5s linear infinite}
  @property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
  @keyframes bordeGira{to{--ang:360deg}}
  /* pista de "toca para ver" */
  .prod-row-more,.card-more{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;
    color:var(--fire-soft);margin-top:6px;opacity:.85;transition:.15s}
  .card-more{margin:8px 0 2px}
  .prod-click:hover .prod-row-more,.prod-click:hover .card-more{opacity:1;gap:7px}
  .prod-row-more svg,.card-more svg{transform:rotate(-90deg)}
  /* flecha al final de la fila */
  .prod-row-arrow{color:var(--text-faint);flex-shrink:0;transition:.16s}
  .prod-row-arrow svg{transform:rotate(-90deg)}
  .prod-row:hover .prod-row-arrow{color:var(--fire-soft);transform:translateX(3px)}
  @media(max-width:640px){.prod-row-arrow{display:none}}
  .card-thumb{height:150px;border-radius:12px;background-size:contain;background-position:center;
    background-repeat:no-repeat;background-color:var(--bg-2);margin-bottom:14px;border:1px solid var(--line-soft)}
  .prod-row-thumb{width:58px;height:58px;border-radius:10px;background-size:contain;background-position:center;
    background-repeat:no-repeat;background-color:var(--bg-2);flex-shrink:0;border:1px solid var(--line-soft)}
  .back-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
    color:var(--text);border-radius:10px;padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:20px;transition:.13s}
  .back-btn:hover{border-color:var(--fire);color:var(--fire-soft)}
  .back-btn svg{transform:rotate(90deg)}
  .pd-wrap{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
  .pd-left{flex:1;min-width:300px;max-width:560px}
  .pd-right{flex:1;min-width:280px}
  .pd-gallery{display:flex;flex-direction:column;gap:12px}
  .pd-main{width:100%;aspect-ratio:16/10;border-radius:16px;background-size:contain;background-position:center;
    background-repeat:no-repeat;border:1px solid var(--line);cursor:zoom-in;background-color:var(--bg-2)}
  .pd-noimg{display:grid;place-items:center;color:var(--text-faint);cursor:default}

  /* ── Verificación por código (6 cajitas) ── */
  .otp-wrap{position:relative;margin:22px 0 6px}
  /* lienzo del circuito: 320x190, centrado */
  .otp-grid{position:relative;width:320px;height:190px;margin:0 auto;transition:opacity .3s}
  .otp-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
  .trace{stroke:#7af5e8;stroke-width:2;fill:none;stroke-dasharray:200;stroke-dashoffset:200;opacity:0;
    filter:drop-shadow(0 0 5px rgba(122,245,232,.75))}
  .trace.on{opacity:1;animation:otpDraw 1.35s ease forwards}
  @keyframes otpDraw{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
  .otp-box{position:absolute;width:52px;height:52px;text-align:center;font-size:24px;font-weight:700;
    color:#cffcf5;background:#0c1a1e;border:1.5px solid #1c3a3a;border-radius:13px;outline:none;z-index:2;
    caret-color:transparent;transition:border-color .25s,box-shadow .25s,transform .2s}
  .otp-box:focus{border-color:#7af5e8;box-shadow:0 0 0 3px rgba(122,245,232,.14),0 0 20px rgba(122,245,232,.4);transform:scale(1.05)}
  .otp-box.lleno{border-color:#7af5e8;color:#dffefa;box-shadow:0 0 16px rgba(122,245,232,.4)}
  .otp-box.error{border-color:#f85149;color:#f85149;animation:otpShake .35s}
  @keyframes otpShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .otp-ok{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:8px;z-index:3}
  .otp-ok.on{display:flex;animation:otpIn .4s ease}
  @keyframes otpIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
  .otp-check{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;
    color:#7af5e8;border:2px solid #7af5e8;background:rgba(122,245,232,.09);
    box-shadow:0 0 22px rgba(122,245,232,.30)}
  .otp-ok-t{color:#7af5e8;font-size:13.5px;font-weight:700}
  .nav-sep{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--text-faint);
    padding:14px 16px 6px;opacity:.7}

  /* ── Separador "O" con brillo ── */
  .or-sep{display:flex;align-items:center;gap:14px;margin:18px 0;color:var(--text-dim);
    font-size:11px;font-weight:600;letter-spacing:2px}
  .or-sep::before,.or-sep::after{content:'';flex:1;height:1px;
    background:linear-gradient(90deg,transparent,var(--line-soft),transparent)}

  /* ── Botón Google premium ── */
  .btn-google{position:relative;width:100%;display:flex;align-items:center;justify-content:center;
    gap:11px;padding:14px;font-size:14.5px;font-weight:600;cursor:pointer;overflow:hidden;
    color:var(--text);border-radius:13px;border:1.5px solid var(--line);
    background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
    transition:transform .18s cubic-bezier(.34,1.56,.64,1),border-color .25s,box-shadow .25s}
  /* borde con gradiente de la marca al pasar el mouse */
  .btn-google::before{content:'';position:absolute;inset:0;border-radius:13px;padding:1.5px;
    background:linear-gradient(120deg,#4285F4,#EA4335,#FBBC05,#34A853,#4285F4);
    background-size:300% 100%;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    opacity:0;transition:opacity .3s}
  /* barrido de luz que cruza el botón */
  .btn-google::after{content:'';position:absolute;top:0;left:-120%;width:70%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);
    transform:skewX(-18deg);transition:none}
  .btn-google:hover{transform:translateY(-2px);
    box-shadow:0 10px 26px rgba(66,133,244,.20),0 2px 8px rgba(0,0,0,.3)}
  .btn-google:hover::before{opacity:1;animation:gborde 4s linear infinite}
  .btn-google:hover::after{animation:gbarrido .9s ease}
  .btn-google:active{transform:translateY(0) scale(.985)}
  .btn-google svg{position:relative;z-index:1;transition:transform .25s}
  .btn-google:hover svg{transform:rotate(-8deg) scale(1.08)}
  .btn-google span{position:relative;z-index:1}
  .btn-google.loading{opacity:.7;pointer-events:none}
  .btn-google.loading svg{animation:gspin 1s linear infinite}
  @keyframes gborde{to{background-position:300% 0}}
  @keyframes gbarrido{0%{left:-120%}100%{left:130%}}
  @keyframes gspin{to{transform:rotate(360deg)}}
  @media(max-width:420px){ .otp-box{width:40px;height:50px;font-size:21px} .otp-grid{gap:7px} }
  .pd-thumbs{display:flex;gap:10px;flex-wrap:wrap}
  .pd-thumb{width:70px;height:56px;border-radius:10px;background-size:contain;background-position:center;
    border:2px solid transparent;cursor:pointer;opacity:.65;transition:.13s;background-repeat:no-repeat;background-color:var(--bg-2)}
  .pd-thumb:hover{opacity:1}
  .pd-thumb.on{border-color:var(--fire);opacity:1}
  .pd-cat{font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .pd-name{font-family:var(--display);font-size:28px;font-weight:700;margin:6px 0 0;line-height:1.15}
  .pd-price{font-family:var(--display);font-size:26px;font-weight:700;color:var(--cyan);margin:0 0 14px}
  .pd-desc{font-size:14.5px;color:var(--text-dim);line-height:1.7;margin-bottom:24px}
  .pd-actions{display:flex;gap:12px;flex-wrap:wrap}
  .pd-actions .btn-primary{width:auto;padding:13px 24px}
  @media(max-width:640px){.pd-name{font-size:23px}}
  /* product list rows */
  .prod-list{display:flex;flex-direction:column;gap:10px}
  .prod-row{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:16px 18px;transition:.15s}
  .prod-row:hover{border-color:var(--fire);box-shadow:0 8px 22px -12px rgba(255,107,44,.45)}
  .prod-row-main{flex:1;min-width:0}
  .prod-row-name{font-family:var(--display);font-size:15.5px;font-weight:600;color:var(--text);margin-bottom:3px}
  .prod-row-desc{font-size:12.5px;color:var(--text-dim);line-height:1.45;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .prod-row-pill{flex-shrink:0}
  .prod-row-actions{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
  @media(max-width:640px){
    .prod-row{flex-wrap:wrap}
    .prod-row-main{flex:1 1 100%}
    .prod-row-actions{flex:1 1 100%}
  }
  /* install steps */
  .inst-list{display:flex;flex-direction:column;gap:14px}
  .inst-step{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line-soft);border-radius:13px;padding:16px 18px}
  .inst-num{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;
    background:linear-gradient(135deg,var(--fire),#E8551C);color:#0A0A0A}
  .inst-step h4{font-family:var(--display);font-size:14.5px;font-weight:600;margin-bottom:4px}
  .inst-step p{font-size:13px;color:var(--text-dim);line-height:1.55}
  /* admin messages */
  .msg-list{display:flex;flex-direction:column;gap:14px;max-width:760px}
  .msg-card{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:18px 20px;transition:border-color .15s}
  .msg-card:hover{border-color:var(--line)}
  .msg-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .msg-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .msg-email{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .msg-date{font-family:var(--mono);font-size:11px;color:var(--text-faint);flex-shrink:0}
  .msg-body{font-size:13.5px;color:var(--text-dim);line-height:1.6;background:var(--bg-2);border-radius:10px;padding:13px 15px;margin-bottom:13px;white-space:pre-wrap}
  .msg-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  /* market news */
  .mkt-list{display:flex;flex-direction:column;gap:8px}
  .mkt-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line-soft);
    border-radius:12px;padding:13px 15px;transition:.15s;color:var(--text)}
  .mkt-item:hover{border-color:var(--cyan);transform:translateX(2px)}
  .mkt-item .ic{color:var(--text-faint);flex-shrink:0}
  .mkt-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex-shrink:0;animation:pulse 2s infinite}
  .mkt-title{font-size:13px;font-weight:500;line-height:1.4;flex:1}
  .mkt-date{font-size:11px;color:var(--text-faint);margin-top:3px}
</style>
</head>
<body>

<div class="grid-bg" aria-hidden="true"></div>
<div class="scan-bg" aria-hidden="true"></div>
<div id="maintBar" class="maint-bar" aria-hidden="true"></div>

<div class="app" id="app"></div>

<!-- ── CENTRO DE AYUDA ────────────────────────────────────────
     Boton flotante con las preguntas frecuentes. No usa IA:
     solo muestra las respuestas que tu has escrito, asi que no
     puede inventarse nada ni prometer resultados. -->
<button class="ay-btn" id="ayBtn" onclick="ayudaToggle()" title="¿Necesitas ayuda?" aria-label="Ayuda">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
       stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"></circle>
    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
    <line x1="12" y1="17" x2="12.01" y2="17"></line>
  </svg>
</button>

<div class="ay-panel" id="ayPanel">
  <div class="ay-head">
    <h3>¿En qué te ayudo?</h3>
    <p>Busca tu duda o mira las preguntas más comunes</p>
  </div>
  <div class="ay-search">
    <input type="text" id="ayInput" placeholder="Escribe tu duda y pulsa Enter..."
           onkeydown="if(event.key==='Enter')ayudaPreguntar()" autocomplete="off">
  </div>
  <div class="ay-body" id="ayBody"></div>
  <div class="ay-foot">
    <!-- Antes iba a WhatsApp. Ahora al formulario del portal: los
         mensajes llegan ordenados a la pestaña Mensajes, solo escriben
         clientes registrados, y no entra spam. -->
    <button class="ay-wa" onclick="ayudaEscribir()">
      Escríbeme desde el portal
    </button>
  </div>
</div>

<div class="modal-bg" id="vidModal">
  <div class="modal"><div class="modal-head"><h3 id="vidTitle">Video</h3>
    <button class="modal-x" onclick="closeModal('vidModal')">✕</button></div>
    <div class="modal-body" id="vidBody"></div></div>
</div>

<div class="modal-bg" id="payModal">
  <div class="modal" style="max-width:440px"><div class="modal-head"><h3 id="payTitle">Comprar</h3>
    <button class="modal-x" onclick="closeModal('payModal')">✕</button></div>
    <div class="modal-body" id="payBody"></div></div>
</div>

<!-- Ventana de confirmacion propia. La del navegador sale con el
     nombre del dominio y rompe el aspecto del portal. -->
<div class="modal-bg" id="confModal">
  <div class="modal" style="max-width:400px">
    <div class="modal-head"><h3 id="confTitulo">¿Seguro?</h3>
      <button class="modal-x" onclick="cerrarConfirmar(false)">✕</button></div>
    <div class="modal-body"><p id="confTexto"
      style="margin:0;font-size:13.5px;line-height:1.65;color:var(--text-dim)"></p></div>
    <div class="modal-foot">
      <button class="btn-ghost" onclick="cerrarConfirmar(false)" id="confNo">Cancelar</button>
      <button class="btn-primary" onclick="cerrarConfirmar(true)" id="confSi">Sí</button></div>
  </div>
</div>

<!-- ventana para apuntar un movimiento en Mi Balance -->
<div class="modal-bg" id="movModal">
  <div class="modal"><div class="modal-head"><h3 id="movTitle">Nuevo movimiento</h3>
    <button class="modal-x" onclick="closeModal('movModal')">✕</button></div>
    <div class="modal-body" id="movBody"></div>
    <div class="modal-foot"><button class="btn-ghost" onclick="closeModal('movModal')">Cancelar</button>
      <button class="btn-primary" id="movGuardar">Guardar</button></div>
  </div>
</div>

<div class="modal-bg" id="prodModal">
  <div class="modal"><div class="modal-head"><h3 id="prodTitle">Producto</h3>
    <button class="modal-x" onclick="closeModal('prodModal')">✕</button></div>
    <div class="modal-body" id="prodBody"></div>
    <div class="modal-foot"><button class="btn-ghost" onclick="closeModal('prodModal')">Cancelar</button>
      <button class="btn-add" onclick="saveProd()">Guardar producto</button></div></div>
</div>

<div class="modal-bg" id="accModal">
  <div class="modal" style="max-width:460px"><div class="modal-head"><h3 id="accTitle">Acceso</h3>
    <button class="modal-x" onclick="closeModal('accModal')">✕</button></div>
    <div class="modal-body" id="accBody"></div>
    <div class="modal-foot"><button class="btn-ghost" onclick="closeModal('accModal')">Cancelar</button>
      <button class="btn-add" onclick="saveAccess()">Guardar acceso</button></div></div>
</div>

<div class="modal-bg" id="guideModal">
  <div class="modal"><div class="modal-head"><h3 id="guideTitle">Guía</h3>
    <button class="modal-x" onclick="closeModal('guideModal')">✕</button></div>
    <div class="modal-body" id="guideBody"></div>
    <div class="modal-foot"><button class="btn-ghost" onclick="closeModal('guideModal')">Cancelar</button>
      <button class="btn-add" onclick="saveGuide()">Guardar guía</button></div></div>
</div>

<div class="modal-bg" id="newsModal">
  <div class="modal"><div class="modal-head"><h3 id="newsTitle">Noticia</h3>
    <button class="modal-x" onclick="closeModal('newsModal')">✕</button></div>
    <div class="modal-body" id="newsBody"></div>
    <div class="modal-foot"><button class="btn-ghost" onclick="closeModal('newsModal')">Cancelar</button>
      <button class="btn-add" onclick="saveNews()">Guardar</button></div></div>
</div>

<div class="modal-bg" id="okModal">
  <div class="modal" style="max-width:440px">
    <div class="modal-body" id="okBody"></div>
    <div class="modal-foot" style="justify-content:center">
      <button class="btn-add" style="min-width:150px" onclick="closeModal('okModal')">Entendido</button></div></div>
</div>

<div class="modal-bg" id="discModal">
  <div class="modal"><div class="modal-head"><h3 id="discTitle">Descuento</h3>
    <button class="modal-x" onclick="closeModal('discModal')">✕</button></div>
    <div class="modal-body" id="discBody"></div>
    <div class="modal-foot"><button class="btn-ghost" onclick="closeModal('discModal')">Cancelar</button>
      <button class="btn-add" onclick="saveDisc()">Guardar</button></div></div>
</div>

<div class="modal-bg" id="pcsModal">
  <div class="modal" style="max-width:400px"><div class="modal-head"><h3>Aprobar licencia</h3>
    <button class="modal-x" onclick="closeModal('pcsModal')">✕</button></div>
    <div class="modal-body" id="pcsBody"></div>
    <div class="modal-foot"><button class="btn-ghost" onclick="closeModal('pcsModal')">Cancelar</button>
      <button class="btn-add" onclick="confirmPcs()">Aprobar</button></div></div>
</div>

<div class="modal-bg" id="confirmModal">
  <div class="modal" style="max-width:400px"><div class="modal-head"><h3 id="cfTitle">Confirmar</h3>
    <button class="modal-x" onclick="closeModal('confirmModal')">✕</button></div>
    <div class="modal-body"><p id="cfMsg" style="font-size:13.5px;color:var(--text-dim);line-height:1.6"></p></div>
    <div class="modal-foot"><button class="btn-ghost" onclick="closeModal('confirmModal')">Cancelar</button>
      <button class="btn-add" id="cfOk" onclick="cfRun()">Confirmar</button></div></div>
</div>

<button class="menu-btn" onclick="document.querySelector('.side')?.classList.toggle('open')">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
</button>

<button class="info-btn" onclick="openInfo()" title="Información">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
</button>

<div class="modal-bg" id="infoModal">
  <div class="modal" style="max-width:480px"><div class="modal-head"><h3>SNIPER PORTAL</h3>
    <button class="modal-x" onclick="closeModal('infoModal')">✕</button></div>
    <div class="modal-body" id="infoBody"></div></div>
</div>

<script>
const CLIENT={name:'',email:''};
const FAQ=[
  // ── CUENTA Y PORTAL ──
  {c:'Cuenta',q:'¿Cómo entro al portal?',a:'Con el correo y la contraseña que registraste. Si tu cuenta aún está pendiente de aprobación, te aviso en cuanto la libere. Puedes marcar "Recordar mi contraseña" para no escribirla cada vez.'},
  {c:'Cuenta',q:'Me registré y no puedo entrar todavía',a:'Cada cuenta la apruebo manualmente para mantener el portal solo para clientes. Normalmente es rápido. Si llevas más de un día esperando, escríbeme desde Contacto (menú de la izquierda) y lo reviso.'},
  {c:'Cuenta',q:'Olvidé mi contraseña, ¿qué hago?',a:'En la pantalla de inicio toca "¿Olvidaste tu contraseña?", pon tu correo y te llega una nueva al instante. Luego cámbiala en Mi Perfil por una que recuerdes.'},
  {c:'Cuenta',q:'¿Cómo cambio mi contraseña?',a:'Entra a Mi Perfil, escribe la nueva contraseña dos veces y toca Guardar. El cambio es inmediato.'},

function enviarCorreo(params){
  try{
    const ahora=Date.now();
    // limpiar registro de más de 1 minuto
    _correosEnviados=_correosEnviados.filter(t=>ahora-t<60000);
    // si ya se mandaron 15 en el último minuto, bloquear (señal de bucle/masa)
    if(_correosEnviados.length>=15){

      return;
    }
    _correosEnviados.push(ahora);
    const qs=Object.keys(params).map(k=>k+'='+encodeURIComponent(params[k])).join('&');

    console.log('[CORREO] enviando ->', params.accion, params.email);

function trustBar(){
  const isEn=LANG==='en';
  const rs=REVIEWS||[];
  const nRes=rs.length;
  const avg=nRes?(rs.reduce((s,r)=>s+(r.estrellas||0),0)/nRes):0;
  // clientes: tu override si lo pusiste, si no el conteo real del servidor, si no el respaldo
  const cli = (SRV_STATS&&SRV_STATS.clientes) ? SRV_STATS.clientes
            : (SRV_STATS&&SRV_STATS.reales!=null&&SRV_STATS.reales>0) ? (SRV_STATS.reales+'')
            : (STATS.clientes||'—');
  const anios = (SRV_STATS&&SRV_STATS.anios) ? SRV_STATS.anios : STATS.anios;
  const prods = (SRV_STATS&&SRV_STATS.productos) ? SRV_STATS.productos : STATS.productos;
  const stats=[
    {v:cli, l:isEn?'Active traders':'Traders activos', ic:I.users},
    {v:(nRes?avg.toFixed(1):'5.0'), l:isEn?`Rating · ${nRes} reviews`:`Calificación · ${nRes} reseñas`, ic:I.star, star:true},
    {v:anios, l:isEn?'Years in the market':'Años en el mercado', ic:I.tool},
    {v:prods, l:isEn?'Pro tools':'Herramientas pro', ic:I.box}
  ];
  return `<div class="trust-wrap">
    <div class="trust-title">${sv(I.check,13)} ${isEn?'Trusted by traders across multiple prop firms':'La confianza de traders en múltiples prop firms'}</div>
    <div class="trust-grid">
      ${stats.map(s=>`<div class="trust-card">
        <div class="trust-ic">${sv(s.ic,17)}</div>
        <div class="trust-v">${s.v}${s.star?'<span class="trust-star">★</span>':''}</div>
        <div class="trust-l">${s.l}</div>
        <div class="trust-shine"></div></div>`).join('')}
    </div></div>`;
}
function sniperBG(){
  let candles='';
  const cols=22, base=170;
  for(let i=0;i<cols;i++){
    const x=i*(680/cols)+8;
    const up=Math.random()>0.48;
    const h=18+Math.random()*70;
    const y=base-Math.random()*90;
    const wick=8+Math.random()*10;
    const col=up?'#1f9d6b':'#c0392b';
    const dur=(5+Math.random()*4).toFixed(1);
    const delay=(Math.random()*4).toFixed(1);
    candles+=`<g opacity="0.55">
      <line x1="${x+5}" y1="${y-wick}" x2="${x+5}" y2="${y+h+wick}" stroke="${col}" stroke-width="1.2"/>
      <rect x="${x}" y="${y}" width="10" height="${h}" rx="1.5" fill="${col}"/></g>`;
  }
  const emblem=`<svg class="corner-emblem" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <circle cx="60" cy="60" r="42" fill="none" stroke="#FF6B2C" stroke-width="3"/>
      <line x1="60" y1="8" x2="60" y2="32" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="60" y1="88" x2="60" y2="112" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="8" y1="60" x2="32" y2="60" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="88" y1="60" x2="112" y2="60" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="60" cy="60" r="20" fill="none" stroke="#fff" stroke-width="2.5"/>
      <ellipse cx="60" cy="60" rx="7" ry="12" fill="#FF6B2C"/>
      <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="30s" repeatCount="indefinite"/>
    </svg>`;
  return `<div class="sniper-bg" aria-hidden="true">
    <svg class="candles-svg" viewBox="0 0 680 220" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">${candles}</svg>
    <div class="emblem-wrap">${emblem}</div>
  </div>`;
}

//     verErrores()   <- escribelo en la consola
//
//  OJO: esto oculta los MENSAJES, no el codigo. El index.html
//  sigue siendo visible en F12 > Sources, como en cualquier
//  pagina web. Lo importante (contrasenas, licencias, datos)
//  vive en el servidor, no aqui.
// ═══════════════════════════════════════════════════════════
(function(){
  const guardados = [];
  const real = { log:console.log, warn:console.warn, error:console.error,
                 info:console.info, debug:console.debug };

  const callar = (tipo) => function(){
    try{
      guardados.push({ tipo, hora:new Date().toISOString(),
        texto:[...arguments].map(x=>{
          try{ return typeof x==='object' ? JSON.stringify(x) : String(x); }
          catch(e){ return String(x); }
        }).join(' ') });
      if (guardados.length > 200) guardados.shift();
    }catch(e){}
  };

  console.log = callar('log');
  console.warn = callar('warn');
  console.error = callar('error');
  console.info = callar('info');
  console.debug = callar('debug');

  // errores que no pasan por console.error
  window.addEventListener('error', e=>{
    try{ guardados.push({ tipo:'error', hora:new Date().toISOString(),
      texto:(e.message||'')+' @ '+(e.filename||'')+':'+(e.lineno||'') }); }catch(x){}
  });
  window.addEventListener('unhandledrejection', e=>{
    try{ guardados.push({ tipo:'error', hora:new Date().toISOString(),
      texto:'promesa: '+String(e.reason) }); }catch(x){}
  });

  // Para ti: escribe verErrores() en la consola y los ves.
  window.verErrores = function(){
    if (!guardados.length){ real.log('Sin errores guardados.'); return; }
    for (const g of guardados) real.log(g.hora.slice(11,19), '['+g.tipo+']', g.texto);
    real.log('--- total:', guardados.length, '---');
  };
  window.limpiarErrores = function(){ guardados.length = 0; real.log('Limpiado.'); };
})();

// El vale de sesion. Sustituye a mandar la contraseña en cada peticion.
let RW_TOKEN = null;
try { RW_TOKEN = localStorage.getItem('rw_token') || null; } catch(e){}
function rwGuardarToken(t){
  RW_TOKEN = t || null;
  try { t ? localStorage.setItem('rw_token', t) : localStorage.removeItem('rw_token'); } catch(e){}
}

async function rwFetch(ruta, cuerpo, metodo='POST'){
  const opciones = {
    method: metodo,
    headers: { 'content-type':'application/json',
               ...(RW_TOKEN ? { 'Authorization':'Bearer '+RW_TOKEN } : {}) }
  };
  if (metodo === 'POST') opciones.body = JSON.stringify(cuerpo || {});
  const r = await fetch(RAILWAY_URL + ruta, opciones);
  return await r.json();
}

// Si el vale caduco, se saca uno nuevo con las credenciales guardadas.
async function rwAsegurarSesion(){
  if (RW_TOKEN) return true;
  if (!SESS || !SESS.email || !SESS.pass) return false;
  const r = await rwFetch('/auth/login', { email:SESS.email, pass:SESS.pass });
  if (r.ok && r.token) { rwGuardarToken(r.token); return true; }
  return false;
}
